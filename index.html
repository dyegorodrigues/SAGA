<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` para o app encostar nas bordas do tablet; o zoom
         continua liberado de propósito — desligá-lo tira a lupa de quem
         enxerga menos, e a tela já é desenhada para caber sem pinçar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="A jornada de matemática do SAGA: noventa competências, uma de cada vez." />

    <!-- "Adicionar à tela de início": sem isto o tablet inventa um ícone
         cinza com uma letra, e o nome do atalho vira o título da aba. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/icone-apple-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SAGA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>SAGA — Matemática</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
