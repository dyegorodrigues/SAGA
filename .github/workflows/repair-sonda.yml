name: Repair sonda

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  repair:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - name: Restaurar e corrigir a sonda atomicamente
        run: |
          git show 762116bfd1e51693c2683ff78f8effdba5123778:scripts/sonda-layout.mjs > scripts/sonda-layout.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sonda-layout.mjs')
          s=p.read_text(encoding='utf-8')
          old='''    const dono = document.elementFromPoint(cx, cy);\n    if (!dono) continue;\n    if (dono === el || el.contains(dono) || dono.contains(el)) continue;'''
          new='''    // `elementFromPoint` ignora elementos com pointer-events:none. Isso é\n    // correto para clique, mas errado para VISIBILIDADE: texto decorativo pode\n    // estar perfeitamente pintado e ainda assim o hit-test devolver o desenho\n    // que está atrás. Tornamos apenas o próprio texto hit-testável durante a\n    // leitura do pixel, sem mudar layout, pintura nem o runtime da aplicação.\n    const pointerInline = el.style.pointerEvents;\n    const ignoradoPeloHitTest = getComputedStyle(el).pointerEvents === "none";\n    if (ignoradoPeloHitTest) el.style.pointerEvents = "auto";\n    const dono = document.elementFromPoint(cx, cy);\n    if (ignoradoPeloHitTest) {\n      if (pointerInline) el.style.pointerEvents = pointerInline;\n      else el.style.removeProperty("pointer-events");\n    }\n    if (!dono) continue;\n    if (dono === el || el.contains(dono) || dono.contains(el)) continue;'''
          if s.count(old) != 1:
              raise SystemExit('bloco de cobertura mudou; abortando')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/sonda-layout.mjs
          git diff --check
          rm .github/workflows/repair-sonda.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add scripts/sonda-layout.mjs .github/workflows/repair-sonda.yml
          git commit -m 'qa: distingue hit-test de cobertura visual'
          git push origin HEAD:codex/integrar-bloco-f0
