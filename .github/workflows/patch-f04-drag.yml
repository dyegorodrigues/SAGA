name: Patch F04 drag ghost

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/corrigir-n113' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n113
          fetch-depth: 0
      - name: Tirar o ghost da arvore transformada
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('src/components/primitives/TouchPlace.tsx'); s=p.read_text(); oi=base64.b64decode('aW1wb3J0IFJlYWN0IGZyb20gInJlYWN0IjsKaW1wb3J0IHsgbW90aW9uIH0gZnJvbSAibW90aW9uL3JlYWN0Ijs=').decode(); ni=base64.b64decode('aW1wb3J0IFJlYWN0IGZyb20gInJlYWN0IjsKaW1wb3J0IHsgY3JlYXRlUG9ydGFsIH0gZnJvbSAicmVhY3QtZG9tIjsKaW1wb3J0IHsgbW90aW9uIH0gZnJvbSAibW90aW9uL3JlYWN0Ijs=').decode(); ob=base64.b64decode('').decode(); nb=base64.b64decode('').decode(); assert s.count(oi)==1 and s.count(ob)==1, (s.count(oi),s.count(ob)); p.write_text(s.replace(oi,ni).replace(ob,nb)); Path('.github/workflows/patch-f04-drag.yml').unlink()"
          git diff --check
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: alinha ghost de arrasto ao dedo na F04'
          git push origin HEAD:codex/corrigir-n113
