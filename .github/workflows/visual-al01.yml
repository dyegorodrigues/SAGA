name: Visual AL.01

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-al01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Sonda rápida e prints AL.01
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar Chrome para a sonda
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            sudo mkdir -p /opt/pw-browsers
            sudo chown -R "$USER":"$USER" /opt/pw-browsers
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          test -n "$CHROME_REAL"
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          /opt/pw-browsers/chromium-1194/chrome-linux/chrome --version

      # LAÇO DE TRABALHO, não o portão final: RETOMADA §3 manda uma semente
      # enquanto se corrige, e as oito somente no fechamento do lote.
      - name: Rodar sonda rápida de AL.01
        env:
          SONDA_SEMENTES: '1'
        run: npm run sonda -- "AL.01"

      - name: Gerar um print por cena de AL.01
        run: |
          rm -rf /tmp/prints
          PRINTS_OUT=/tmp/prints node scripts/prints.mjs "AL.01"
          ls -lh /tmp/prints

      - name: Montar folha de contato
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          files = sorted(Path('/tmp/prints').glob('*.png'))
          if not files:
              raise SystemExit('nenhum print gerado')

          thumb_w, thumb_h = 195, 320
          cols = 2
          rows = (len(files) + cols - 1) // cols
          label_h = 34
          sheet = Image.new('RGB', (cols * thumb_w, rows * (thumb_h + label_h)), 'white')
          draw = ImageDraw.Draw(sheet)

          for i, path in enumerate(files):
              img = Image.open(path).convert('RGB')
              img.thumbnail((thumb_w, thumb_h))
              canvas = Image.new('RGB', (thumb_w, thumb_h), 'white')
              canvas.paste(img, ((thumb_w-img.width)//2, (thumb_h-img.height)//2))
              x = (i % cols) * thumb_w
              y = (i // cols) * (thumb_h + label_h)
              sheet.paste(canvas, (x, y))
              label = path.stem.replace('_', ' ')[:42]
              draw.text((x+4, y+thumb_h+4), f'{i+1}. {label}', fill='black')

          sheet.save('/tmp/prints/contact-sheet.jpg', quality=78, optimize=True)
          print(f'CONTACT_SHEET_COUNT={len(files)}')
          PY

      - name: Publicar prints para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: al01-prints
          path: /tmp/prints
          if-no-files-found: error
          retention-days: 7
