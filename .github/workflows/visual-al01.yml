name: Visual AL.01

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-al01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Sonda rápida e prints AL.01
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar Chrome para a sonda
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            sudo mkdir -p /opt/pw-browsers
            sudo chown -R "$USER":"$USER" /opt/pw-browsers
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          test -n "$CHROME_REAL"
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          /opt/pw-browsers/chromium-1194/chrome-linux/chrome --version

      # LAÇO DE TRABALHO, não o portão final: RETOMADA §3 manda uma semente
      # enquanto se corrige, e as oito somente no fechamento do lote.
      - name: Rodar sonda rápida de AL.01
        env:
          SONDA_SEMENTES: '1'
        run: npm run sonda -- "AL.01"

      - name: Gerar um print por cena de AL.01
        run: |
          rm -rf /tmp/prints
          PRINTS_OUT=/tmp/prints node scripts/prints.mjs "AL.01"
          ls -lh /tmp/prints

      # O nível 3 é temporal: a primeira foto só mostra a primeira classificação.
      # Este driver joga a primeira metade sem conhecer a resposta: tenta o laço;
      # se a peça volta, tenta FORA. O sinal de fim não é "bandeja vazia" — ao
      # terminar, a própria ficha devolve TODAS as peças ao centro. O sinal é o
      # estado pedagógico explícito `Agora mudou!`.
      - name: Capturar transição e segunda fase do nível 3
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import { chromium } from 'playwright-core';

          const porta = 5197;
          const vite = spawn('npx', ['vite', '--port', String(porta), '--strictPort'], {
            stdio: ['ignore', 'pipe', 'pipe'], detached: true,
          });
          await new Promise((ok, no) => {
            const t = setTimeout(() => no(new Error('vite não subiu')), 60000);
            vite.stdout.on('data', d => {
              if (String(d).includes('ready in')) { clearTimeout(t); ok(); }
            });
          });

          const browser = await chromium.launch({
            executablePath: '/opt/pw-browsers/chromium-1194/chrome-linux/chrome',
            args: ['--no-sandbox'],
          });
          const page = await browser.newPage({ viewport: { width: 390, height: 640 }, deviceScaleFactor: 2 });
          await page.goto(`http://localhost:${porta}/sonda/?sementes=1`, { waitUntil: 'networkidle' });
          await page.waitForFunction(() => window.sonda?.total > 0);
          const nomes = await page.evaluate(() => window.sonda.nomes());
          const indice = nomes.findIndex(n => n.startsWith('AL.01 classificar (nível 3)'));
          if (indice < 0) throw new Error('cena AL.01 nível 3 não encontrada');
          await page.evaluate(i => window.sonda.ir(i), indice);
          await page.waitForTimeout(350);

          const bandeja = page.locator('[aria-label="Peças para separar"]');
          const fora = page.locator('[aria-label="Deixar fora dos laços"]');
          const laco = page.locator('button[aria-label^="Laço:"]').first();
          const mudou = page.getByText('Agora mudou!', { exact: true });

          let guarda = 0;
          while (!(await mudou.count())) {
            if (++guarda > 30) throw new Error('não consegui terminar a primeira classificação');
            const antes = await bandeja.locator('button').count();
            if (antes === 0) {
              await page.waitForTimeout(30);
              continue;
            }
            await bandeja.locator('button').first().click();
            await laco.click();
            await page.waitForTimeout(25);
            if (await mudou.count()) break;
            if (await bandeja.locator('button').count() === antes) {
              await bandeja.locator('button').first().click();
              await fora.click();
              await page.waitForTimeout(25);
            }
          }

          await page.waitForTimeout(80);
          await page.screenshot({ path: '/tmp/prints/AL.01_nivel_3_TRANSICAO.png' });
          await page.waitForTimeout(2600);
          await page.screenshot({ path: '/tmp/prints/AL.01_nivel_3_SEGUNDA_CLASSIFICACAO.png' });
          await browser.close();
          try { process.kill(-vite.pid, 'SIGKILL'); } catch { vite.kill('SIGKILL'); }
          NODE

      - name: Montar folha de contato
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          files = sorted(Path('/tmp/prints').glob('*.png'))
          if not files:
              raise SystemExit('nenhum print gerado')

          thumb_w, thumb_h = 195, 320
          cols = 2
          rows = (len(files) + cols - 1) // cols
          label_h = 34
          sheet = Image.new('RGB', (cols * thumb_w, rows * (thumb_h + label_h)), 'white')
          draw = ImageDraw.Draw(sheet)

          for i, path in enumerate(files):
              img = Image.open(path).convert('RGB')
              img.thumbnail((thumb_w, thumb_h))
              canvas = Image.new('RGB', (thumb_w, thumb_h), 'white')
              canvas.paste(img, ((thumb_w-img.width)//2, (thumb_h-img.height)//2))
              x = (i % cols) * thumb_w
              y = (i // cols) * (thumb_h + label_h)
              sheet.paste(canvas, (x, y))
              label = path.stem.replace('_', ' ')[:42]
              draw.text((x+4, y+thumb_h+4), f'{i+1}. {label}', fill='black')

          sheet.save('/tmp/prints/contact-sheet.jpg', quality=78, optimize=True)
          print(f'CONTACT_SHEET_COUNT={len(files)}')
          PY

      - name: Publicar prints para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: al01-prints
          path: /tmp/prints
          if-no-files-found: error
          retention-days: 7
