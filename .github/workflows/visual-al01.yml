name: Visual AL.01

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    name: Sonda e prints AL.01
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown -R "$USER":"$USER" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium

      - name: Rodar sonda filtrada de AL.01
        run: npm run sonda -- "AL.01"

      - name: Gerar prints de AL.01
        run: |
          rm -rf /tmp/prints
          PRINTS_OUT=/tmp/prints node scripts/prints.mjs "AL.01"
          ls -lh /tmp/prints

      - name: Montar folha de contato para inspeção no agente
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import base64, io

          files = sorted(Path('/tmp/prints').glob('*.png'))
          if not files:
              raise SystemExit('nenhum print gerado')

          thumb_w, thumb_h = 195, 320
          cols = 2
          rows = (len(files) + cols - 1) // cols
          label_h = 34
          sheet = Image.new('RGB', (cols * thumb_w, rows * (thumb_h + label_h)), 'white')
          draw = ImageDraw.Draw(sheet)

          for i, path in enumerate(files):
              img = Image.open(path).convert('RGB')
              img.thumbnail((thumb_w, thumb_h))
              canvas = Image.new('RGB', (thumb_w, thumb_h), 'white')
              canvas.paste(img, ((thumb_w-img.width)//2, (thumb_h-img.height)//2))
              x = (i % cols) * thumb_w
              y = (i // cols) * (thumb_h + label_h)
              sheet.paste(canvas, (x, y))
              label = path.stem.replace('_', ' ')[:42]
              draw.text((x+4, y+thumb_h+4), f'{i+1}. {label}', fill='black')

          buf = io.BytesIO()
          sheet.save(buf, format='JPEG', quality=72, optimize=True)
          data = base64.b64encode(buf.getvalue()).decode('ascii')
          print('CONTACT_SHEET_B64_BEGIN')
          print(data)
          print('CONTACT_SHEET_B64_END')
          print(f'CONTACT_SHEET_COUNT={len(files)}')
          PY
