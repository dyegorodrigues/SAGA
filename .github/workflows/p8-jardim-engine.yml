name: P8 - motor do Jardim

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  engine:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar motor P8
        run: python AI_Studio_Lab/tools/p8_engine_apply.py
      - name: Verificar diff e contratos
        run: |
          git diff --check
          npm run auditar
          npm run fichas:auditar
          npm run grafo:check
          npx tsc --noEmit
      - name: Teste focal Jardim
        run: npx vitest run src/curriculum/motores/jardimEngine.test.ts src/curriculum/fichas/dojo/jardim/jardim.test.ts
      - name: Suite completa e build
        run: |
          npm test -- --run
          npm run build
      - name: Publicar motor aprovado e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p8_engine_apply.py .github/workflows/p8-jardim-engine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P8: cria motor puro de automaticidade do Jardim'
          git push origin HEAD:codex/integrar-bloco-f0
