name: Visual F04 N1.13

on:
  pull_request:
    branches: [main]

concurrency:
  group: visual-f04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.head_ref == 'codex/corrigir-n113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n113
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar Chromium
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            sudo mkdir -p /opt/pw-browsers
            sudo chown -R "$USER":"$USER" /opt/pw-browsers
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          test -n "$CHROME_REAL"
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Completar localmente o catalogo visual F04
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sonda/cenas.tsx')
          s = p.read_text()
          old = '  ...[1, 3, 4, 5].map(lvl => ({\n    nome: `N1.13 produzir quantidade (nível ${lvl})`,'
          new = '  ...[1, 2, 3, 4, 5].map(lvl => ({\n    nome: `N1.13 produzir quantidade (nível ${lvl})`,'
          if s.count(old) != 1:
              raise SystemExit(f'escada N1.13: esperado 1, achei {s.count(old)}')
          s = s.replace(old, new)
          s = s.replace('nome: "N1.09 micro-aula: as vagas pulsando"', 'nome: "N1.13 micro-aula: as vagas pulsando"')
          anchor = '''  {
    nome: "N1.13 micro-aula: as vagas pulsando",
    render: (s: number) => (
      <ExercicioDaFicha ficha={N1_13} lvl={1} semente={s} mostrar={{ pulsarVagas: true }} />
    ),
  },'''
          ghost = anchor + '''
  {
    nome: "N1.13 micro-aula: mao fantasma bandeja para vaga",
    render: (s: number) => (
      <ExercicioDaFicha ficha={N1_13} lvl={1} semente={s}
        mostrar={{ maoFantasma: { de: "bandeja", para: "vaga0" } }} />
    ),
  },'''
          if s.count(anchor) != 1:
              raise SystemExit(f'cena tutorial N1.13: esperado 1, achei {s.count(anchor)}')
          p.write_text(s.replace(anchor, ghost))
          PY
          git diff --check
      - name: Portao geometrico F04 — 8 sementes
        env:
          SONDA_SEMENTES: '8'
        run: npm run sonda -- "N1.13"
      - name: Prints obrigatorios do briefing
        env:
          PRINTS_OUT: /tmp/f04/prints
          PRINTS_LARGURA: '390'
        run: node scripts/prints.mjs "N1.13"
      - name: Provar estados motores em Chromium
        run: |
          mkdir -p /tmp/f04/states
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import { chromium } from 'playwright-core';
          const porta = 5199;
          const vite = spawn('npx', ['vite', '--port', String(porta), '--strictPort'], {
            stdio: ['ignore', 'pipe', 'pipe'], detached: true,
          });
          await new Promise((ok, no) => {
            const t = setTimeout(() => no(new Error('vite nao subiu')), 60000);
            vite.stdout.on('data', d => {
              if (String(d).includes('ready in')) { clearTimeout(t); ok(); }
            });
          });
          const browser = await chromium.launch({
            executablePath: '/opt/pw-browsers/chromium-1194/chrome-linux/chrome',
            args: ['--no-sandbox'],
          });
          const page = await browser.newPage({ viewport: { width: 390, height: 640 }, deviceScaleFactor: 2 });
          await page.goto(`http://localhost:${porta}/sonda/?sementes=1`, { waitUntil: 'networkidle' });
          await page.waitForFunction(() => window.sonda?.total > 0);
          const nomes = await page.evaluate(() => window.sonda.nomes());
          const achar = trecho => {
            const i = nomes.findIndex(n => n.includes(trecho));
            if (i < 0) throw new Error(`cena ausente: ${trecho}`);
            return i;
          };
          const ir = async trecho => {
            await page.evaluate(i => window.sonda.ir(i), achar(trecho));
            await page.waitForTimeout(450);
          };

          // L1: arrasto real — objeto segue o dedo, halo aparece e drop ocupa vaga.
          await ir('N1.13 produzir quantidade (nível 1)');
          const tray = page.locator('[data-touchplace-tray]');
          const slot = page.locator('[aria-label="Vaga vazia"]').first();
          const tb = await tray.boundingBox();
          const sb = await slot.boundingBox();
          if (!tb || !sb) throw new Error('bandeja/vaga sem geometria');
          const start = { x: tb.x + tb.width / 2, y: tb.y + tb.height / 2 };
          const end = { x: sb.x + sb.width / 2, y: sb.y + sb.height / 2 };
          await page.mouse.move(start.x, start.y);
          await page.mouse.down();
          await page.mouse.move(end.x, end.y, { steps: 8 });
          await page.waitForTimeout(120);
          await page.screenshot({ path: '/tmp/f04/states/90_F04_DRAG_HALO.png' });
          const halos = await page.locator('[aria-label="Vaga vazia"]').evaluateAll(nodes =>
            nodes.filter(n => getComputedStyle(n).boxShadow !== 'none').length);
          if (halos < 1) throw new Error('arrasto nao acendeu halo de vaga');
          await page.mouse.up();
          await page.waitForTimeout(250);
          await page.screenshot({ path: '/tmp/f04/states/91_F04_DROP.png' });
          const ocupados = await page.locator('[aria-label^="estrela "]').count()
            + await page.locator('[aria-label^="dinossauro "]').count()
            + await page.locator('[aria-label^="carrinho "]').count();
          if (ocupados < 1) throw new Error('drop nao assentou objeto');

          // L4: sem vaga, Pronto! errado reporta mas devolve a interacao.
          await ir('N1.13 produzir quantidade (nível 4)');
          if (await page.locator('[aria-label="Vaga vazia"]').count()) throw new Error('L4 ainda desenha vagas');
          await page.locator('[data-touchplace-tray]').click();
          const campo = page.locator('[role="button"][aria-label^="Colocar "]').first();
          await campo.click({ position: { x: 80, y: 80 } });
          const pronto = page.getByRole('button', { name: 'Pronto!' });
          await pronto.click();
          await page.waitForTimeout(120);
          await page.screenshot({ path: '/tmp/f04/states/92_F04_ERRO_PRONTO.png' });
          if (!(await pronto.isDisabled())) throw new Error('erro autoral nao travou durante feedback');
          await page.waitForTimeout(950);
          await page.screenshot({ path: '/tmp/f04/states/93_F04_RETRY.png' });
          if (await pronto.isDisabled()) throw new Error('retry autoral nao devolveu a interacao');

          // L5: pedido unico — nao existe botao de replay.
          await ir('N1.13 produzir quantidade (nível 5)');
          if (await page.locator('[aria-label="Ouvir o pedido de novo"]').count()) throw new Error('L5 oferece replay indevido');
          await page.screenshot({ path: '/tmp/f04/states/94_F04_L5_SEM_REPLAY.png' });

          // Tutorial: objeto + mao viajam juntos; nenhuma vaga e resolvida.
          await page.evaluate(i => window.sonda.ir(i), achar('mao fantasma bandeja para vaga'));
          await page.waitForTimeout(900);
          await page.screenshot({ path: '/tmp/f04/states/95_F04_MAO_FANTASMA.png' });
          if (!(await page.getByText('👆', { exact: true }).count())) throw new Error('mao fantasma ausente');
          if (!(await page.locator('[aria-label="Vaga vazia"]').count())) throw new Error('tutorial resolveu a resposta em vez de demonstrar');

          await browser.close();
          try { process.kill(-vite.pid, 'SIGKILL'); } catch { vite.kill('SIGKILL'); }
          NODE
      - name: Folha de contato
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          files = sorted(Path('/tmp/f04/prints').glob('*.png')) + sorted(Path('/tmp/f04/states').glob('*.png'))
          tw, th, label = 195, 320, 28
          cols = 2
          rows = (len(files) + cols - 1) // cols
          out = Image.new('RGB', (cols * tw, rows * (th + label)), 'white')
          draw = ImageDraw.Draw(out)
          for i, p in enumerate(files):
              im = Image.open(p).convert('RGB')
              im.thumbnail((tw, th))
              x = (i % cols) * tw
              y = (i // cols) * (th + label)
              out.paste(im, (x + (tw-im.width)//2, y + (th-im.height)//2))
              draw.text((x+3, y+th+2), p.stem[:40], fill='black')
          out.save('/tmp/f04/contact-sheet.jpg', quality=84)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f04-n113-prints
          path: /tmp/f04
          retention-days: 7
