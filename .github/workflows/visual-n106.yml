name: Close N1.06 correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'codex/corrigir-n106' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n106
          fetch-depth: 0
      - name: Registrar handoff e remover bancada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AI_Studio_Lab/codex/RETOMADA.md')
          s = p.read_text()
          marker = '## Registro Codex — N1.06 / F05 (7/ago/2026)'
          if marker not in s:
              s += '''

---

## Registro Codex — N1.06 / F05 (7/ago/2026)

**Branch:** `codex/corrigir-n106` · **PR:** #27 · **estado:** correção fechada,
**NÃO ativada**. `N1.06` continua fora de `COMPOSER_CANARIES`; produção segue no
rollback legado até existir PR separado de ativação.

A F05 foi relida §1–§9 e auditada como sistema: ficha/Bíblia → grafo → Composer →
`audiochoice` → Stage/Renderer → GameLoop → Radar/evidência → sonda/Chromium.
Os defeitos confirmados antes da ativação foram:

1. opções apareciam antes da primeira audição automática;
2. erro travava a tela e podia revelar a resposta correta;
3. autoplay podia não reiniciar quando a questão seguinte tinha o mesmo alvo;
4. o beat de ondas da §8 não produzia efeito;
5. GameLoop narrava/punha feedback genérico por cima do feedback autoral da F05;
6. mascote, balão, cartão genérico e `Como faz?` invadiam a tela deliberadamente vazia;
7. `audiochoice` não chegava ao Radar e `PRIMEIRA_AUDICAO` podia ser concedida
   depois de uma primeira resposta errada;
8. `questionDiagnostics` apagava hipóteses embutidas numa ação terminal correta
   (defeito transversal que também atingia F51/F04);
9. quatro alternativas quebravam em **3+1**, criando uma pista posicional;
10. a primeira tentativa de sincronizar o enunciado dentro do Stage violou a
    invariável global `enunciadoUnico`; a decisão foi revertida arquiteturalmente,
    sem afrouxar o teste.

**Arquitetura final da F05:** o Stage desenha a interação e emite o evento de fim
da primeira audição; o Renderer só transporta esse evento; o **GameLoop continua
sendo o único dono de `q.prompt`** e o revela no momento correto. O palco possui o
retry/feedback da ficha; o GameLoop registra a tentativa e não fala por cima.
`audioChoiceRuntime` concentra diagnóstico/evidência temporal. Quatro alternativas
usam grade 2×2; duas usam 1×2; três usam 1×3.

**⚠️ Divergência declarada F05 §4 × §6 — `NAO_ESCUTOU`.** A §4 manda o áudio tocar
automaticamente **antes** de as opções aparecerem; portanto "escolheu a primeira
opção sem apertar replay" não prova que a criança não ouviu. `NAO_ESCUTOU` ficou
restrito ao estado temporal defensivo em que uma resposta ocorre antes do fim da
primeira audição. A posição estática da alternativa nunca emite essa tag.

**Portões finais do runtime:** CI completo verde no run `31188064450` (catálogo,
fichas, grafo, TypeScript, testes, build e guarda de binários). Portão visual final
verde no run `31188061774`: **8 sementes**, Chromium real, abertura → convite →
erro suave → retry → fecho e níveis 1/4/5. Prints L4/L5 confirmaram 2×2 simétrico.
A foto dinâmica do fecho da sonda mantém o prompt porque a casca simplificada não
modela `status="right"`; o app real o esconde por `!status`, protegido por
`enunciadoUnico.test.ts`. Não se alterou runtime para satisfazer esse falso estado
da bancada.

**Inventário documental:** `AI_Studio_Lab/pedagogia/PRIMITIVAS_SAGA.md` está
atrasado nesta área — ainda descreve `AudioChoice`/`TouchPlace` como "faltando
ligar", embora Composer e renderer já os alcancem. Tratar o inventário como
histórico, não como verdade de runtime, até revisão documental própria.

### Auditoria paralela já confirmada — N1.13 / F04

Nenhum código da F04 foi misturado neste PR. A leitura sistêmica já confirmou,
para a próxima branch da fila:

- grafo coerente: `N1.13` nasce de `N1.02 + N1.04` e não usurpa `N1.09`;
- `TouchPlace` tem alternativa por toque, mas **não implementa o arrasto** exigido
  pela F04 §4 + adendo §8.3-bis (o cânone exige arrasto **e** toque alternativo);
- Mão Fantasma aponta, mas não demonstra de fato `bandeja0 → vaga0`;
- `TouchPlaceStage` não reseta estado ao receber nova `spec`;
- há uma corrida de ~500ms no auto-fecho: depois da última vaga a interação ainda
  pode ocorrer, e o callback pode capturar `recusas` antigo;
- o erro autoral de `TouchPlaceStage` entra em conflito com o retry genérico do
  GameLoop e pode deixar a tela encerrada enquanto o motor espera nova tentativa;
- `DEPENDE_DE_ANDAIME` existe no procedimento/teste, mas não tem consumidor fora
  deles. É diagnóstico **longitudinal** e deve ser ligado no nível de histórico,
  não inventado a partir de uma questão isolada;
- a suspeita de que recusas contaminariam automaticamente a coroa **não foi
  confirmada**: não alterar `progressEngine` sem uma prova reproduzível.

Próxima execução deve criar branch própria da `main` para **N1.13/F04**, corrigir
o lote, gerar/abrir prints e só depois pensar em ativação. Nenhum destes achados
justifica alterar ficha canônica ou grafo silenciosamente.
'''
              p.write_text(s)
          Path('.github/workflows/visual-n106.yml').unlink()
          PY
          git diff --check
      - name: Commitar fechamento na branch N1.06
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: registra fechamento da correção F05'
          git push origin HEAD:codex/corrigir-n106
