name: Implement F50 GM12

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  implement:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Construir procedimento, contrato e palcos da F50
        run: |
          cat > src/curriculum/procedimentos/medidasProcedure.ts <<'EOF'
          import { Evidencia } from "../../constants/evidencias";
          import { MisconceptionTag } from "../../constants/misconceptions";

          /** F50 — comparar e conservar massa/capacidade sem unidade padronizada. */
          export type ModoMedida = "peso" | "capacidade";

          export interface AcaoDeMedida {
            modo: ModoMedida;
            escolhido: number;
            certo: number;
            ordemProduzida?: number[];
            ordemCerta: number[];
            ordemVisual: number[];
            contraintuitivo: boolean;
            formatosDiferentes: boolean;
            verificou: boolean;
            maiorVisual: number;
          }

          function mesmaOrdem(a: number[] | undefined, b: number[]): boolean {
            return Boolean(a && a.length === b.length && a.every((v, i) => v === b[i]));
          }

          export function acertou(acao: AcaoDeMedida): boolean {
            if (acao.ordemProduzida) return mesmaOrdem(acao.ordemProduzida, acao.ordemCerta);
            return acao.escolhido === acao.certo;
          }

          /** §6 — hipótese cognitiva, nunca punição. */
          export function diagnosticar(acao: AcaoDeMedida): string | undefined {
            if (acertou(acao)) return undefined;

            if (acao.modo === "capacidade" && acao.formatosDiferentes && !acao.verificou) {
              return MisconceptionTag.IGNORA_FORMATO;
            }

            if (acao.ordemProduzida && mesmaOrdem(acao.ordemProduzida, acao.ordemVisual)) {
              return acao.modo === "peso"
                ? MisconceptionTag.CONFUNDE_PESO_VOLUME
                : MisconceptionTag.IGNORA_FORMATO;
            }

            const primeiro = acao.ordemProduzida?.[0] ?? acao.escolhido;
            if (primeiro === acao.maiorVisual) return MisconceptionTag.JULGA_PELO_TAMANHO;

            return acao.modo === "peso"
              ? MisconceptionTag.CONFUNDE_PESO_VOLUME
              : MisconceptionTag.IGNORA_FORMATO;
          }

          /** §9: pelo menos um acerto no caso que contradiz a aparência. */
          export function evidenciasDe(acao: AcaoDeMedida): string[] {
            return acertou(acao) && acao.contraintuitivo
              ? [Evidencia.CASO_CONTRAINTUITIVO]
              : [];
          }

          export function dominou(historico: AcaoDeMedida[]): boolean {
            const corretas = historico.filter(acertou);
            return corretas.length >= 3 && corretas.some(a => a.contraintuitivo);
          }
          EOF

          cat > src/curriculum/procedimentos/medidasContract.ts <<'EOF'
          import { ModoMedida } from "./medidasProcedure";

          export interface ItemDeMedida {
            id: string;
            emoji: string;
            nome: string;
            /** Grandeza verdadeira; sem unidade visível em F0. */
            valor: number;
            /** Tamanho aparente do objeto/recipiente — pode deliberadamente enganar. */
            tamanhoVisual: number;
            /** Capacidade: largura relativa do recipiente. */
            largura?: number;
            /** Capacidade: altura relativa do recipiente. */
            altura?: number;
            /** Capacidade: altura aparente do líquido antes da verificação. */
            preenchimento?: number;
          }

          export interface MedidasSpec {
            nivel: number;
            modo: ModoMedida;
            seriacao: boolean;
            contraintuitivo: boolean;
            formatosDiferentes: boolean;
            itens: ItemDeMedida[];
            resposta: number;
            ordemCerta: number[];
            ordemVisual: number[];
            maiorVisual: number;
            enunciado: string;
            falado: string;
          }

          function embaralhar<T>(lista: T[], sorteio: () => number): T[] {
            const fora = [...lista];
            for (let i = fora.length - 1; i > 0; i -= 1) {
              const j = Math.floor(sorteio() * (i + 1)) % (i + 1);
              [fora[i], fora[j]] = [fora[j], fora[i]];
            }
            return fora;
          }

          function ordenar(itens: ItemDeMedida[], valor: (x: ItemDeMedida) => number): number[] {
            return [...itens.keys()].sort((a, b) => valor(itens[b]) - valor(itens[a]));
          }

          function pesoDoNivel(nivel: number): ItemDeMedida[] {
            if (nivel === 1) {
              return [
                { id: "pena", emoji: "🪶", nome: "pena", valor: 1, tamanhoVisual: 0.72 },
                { id: "pedra", emoji: "🪨", nome: "pedra", valor: 6, tamanhoVisual: 1.05 },
              ];
            }
            if (nivel === 4) {
              // O pequeno é MAIS pesado: a aparência aponta para a resposta errada.
              return [
                { id: "peso", emoji: "⚙️", nome: "pecinha de metal", valor: 8, tamanhoVisual: 0.68 },
                { id: "almofada", emoji: "🧸", nome: "ursão de pelúcia", valor: 3, tamanhoVisual: 1.34 },
              ];
            }
            // L5: três valores distintos e uma ordem visual deliberadamente diferente.
            return [
              { id: "metal", emoji: "🔩", nome: "metal", valor: 8, tamanhoVisual: 0.72 },
              { id: "caixa", emoji: "📦", nome: "caixa", valor: 5, tamanhoVisual: 1.30 },
              { id: "bola", emoji: "🏐", nome: "bola", valor: 2, tamanhoVisual: 1.02 },
            ];
          }

          function capacidadeDoNivel(nivel: number): ItemDeMedida[] {
            if (nivel === 2) {
              return [
                { id: "copo-a", emoji: "🥛", nome: "copo", valor: 0.38, tamanhoVisual: 1, largura: 1, altura: 1, preenchimento: 0.38 },
                { id: "copo-b", emoji: "🥛", nome: "copo", valor: 0.72, tamanhoVisual: 1, largura: 1, altura: 1, preenchimento: 0.72 },
              ];
            }
            if (nivel === 3) {
              // O estreito parece MAIS cheio, mas contém MENOS. É a armadilha da §2/§5.
              return [
                { id: "alto-fino", emoji: "🧪", nome: "copo alto e fino", valor: 0.46, tamanhoVisual: 1.12, largura: 0.62, altura: 1.22, preenchimento: 0.78 },
                { id: "baixo-largo", emoji: "🥣", nome: "copo baixo e largo", valor: 0.72, tamanhoVisual: 1.28, largura: 1.30, altura: 0.82, preenchimento: 0.56 },
              ];
            }
            // L5: três recipientes, e ordenar por altura aparente do líquido dá a ordem errada.
            return [
              { id: "fino", emoji: "🧪", nome: "recipiente fino", valor: 0.38, tamanhoVisual: 0.78, largura: 0.50, altura: 1.22, preenchimento: 0.80 },
              { id: "largo", emoji: "🥣", nome: "recipiente largo", valor: 0.58, tamanhoVisual: 1.32, largura: 1.30, altura: 0.82, preenchimento: 0.47 },
              { id: "medio", emoji: "🥛", nome: "recipiente médio", valor: 0.78, tamanhoVisual: 1.02, largura: 1.24, altura: 1.00, preenchimento: 0.63 },
            ];
          }

          export function construirMedidasSpec(nivelBruto: number, sorteio: () => number): MedidasSpec {
            const nivel = Math.min(5, Math.max(1, Math.round(nivelBruto)));
            const seriacao = nivel === 5;
            const modo: ModoMedida = nivel === 1 || nivel === 4
              ? "peso"
              : nivel === 2 || nivel === 3
                ? "capacidade"
                : (sorteio() < 0.5 ? "peso" : "capacidade");

            const base = modo === "peso" ? pesoDoNivel(nivel) : capacidadeDoNivel(nivel);
            const itens = embaralhar(base, sorteio);
            const ordemCerta = ordenar(itens, i => i.valor);
            const valorVisual = (i: ItemDeMedida) => modo === "capacidade"
              ? (i.preenchimento ?? 0)
              : i.tamanhoVisual;
            const ordemVisual = ordenar(itens, valorVisual);
            const maiorVisual = ordemVisual[0];
            const resposta = ordemCerta[0];
            const formatosDiferentes = modo === "capacidade" && nivel >= 3;
            const contraintuitivo = nivel === 3 || nivel === 4;
            const enunciado = seriacao
              ? (modo === "peso"
                ? "Toque do mais pesado para o mais leve."
                : "Toque do que cabe mais para o que cabe menos.")
              : (modo === "peso" ? "Qual é mais pesado?" : "Em qual cabe mais líquido?");

            return {
              nivel, modo, seriacao, contraintuitivo, formatosDiferentes,
              itens, resposta, ordemCerta, ordemVisual, maiorVisual,
              enunciado, falado: enunciado,
            };
          }

          export function semEmpate(spec: MedidasSpec): boolean {
            return new Set(spec.itens.map(i => i.valor)).size === spec.itens.length;
          }

          export function armadilhaReal(spec: MedidasSpec): boolean {
            return !spec.contraintuitivo || spec.ordemVisual[0] !== spec.ordemCerta[0];
          }
          EOF

          cat > src/components/primitives/Recipientes.tsx <<'EOF'
          import React from "react";
          import { motion } from "motion/react";
          import { ItemDeMedida } from "../../curriculum/procedimentos/medidasContract";

          interface Props {
            itens: ItemDeMedida[];
            verificado: boolean;
            disabled?: boolean;
            ordem?: number[];
            onChoose?: (i: number) => void;
            onVerify?: () => void;
          }

          function dimensoes(item: ItemDeMedida, compacto: boolean) {
            const baseW = compacto ? 58 : 78;
            const baseH = compacto ? 92 : 126;
            return {
              width: Math.round(baseW * (item.largura ?? 1)),
              height: Math.round(baseH * (item.altura ?? 1)),
            };
          }

          export function Recipientes({ itens, verificado, disabled, ordem = [], onChoose, onVerify }: Props) {
            const max = Math.max(...itens.map(i => i.valor));
            const compacto = itens.length >= 3;
            return (
              <div className="flex w-full flex-col items-center gap-3" data-recipientes-stage>
                <div className="flex min-h-[164px] w-full items-end justify-center gap-3 px-1">
                  {itens.map((item, i) => {
                    const d = dimensoes(item, compacto);
                    const posto = ordem.indexOf(i);
                    return (
                      <button
                        key={item.id}
                        type="button"
                        className="relative flex min-h-[84px] min-w-[76px] flex-col items-center justify-end rounded-2xl p-1 focus-visible:outline-4 focus-visible:outline-blue-500 disabled:opacity-70"
                        aria-label={`${item.nome} ${i + 1}`}
                        disabled={disabled}
                        onClick={() => onChoose?.(i)}
                      >
                        <span className="relative block" style={{ width: d.width, height: d.height }}>
                          <span
                            aria-hidden
                            className="absolute inset-0 overflow-hidden border-[4px] border-slate-500 bg-white/70 shadow-inner"
                            style={{ borderRadius: `${Math.max(12, d.width * 0.22)}px ${Math.max(12, d.width * 0.22)}px ${Math.max(18, d.width * 0.38)}px ${Math.max(18, d.width * 0.38)}px` }}
                          >
                            <motion.span
                              className="absolute inset-x-0 bottom-0 block bg-sky-400/80"
                              initial={false}
                              animate={{ height: `${Math.round((item.preenchimento ?? 0.5) * 100)}%` }}
                              transition={{ duration: 0.7 }}
                            />
                          </span>
                          <span aria-hidden className="absolute -right-2 -top-4 text-2xl">{item.emoji}</span>
                        </span>
                        {posto >= 0 && (
                          <span className="absolute right-0 top-0 flex h-7 w-7 items-center justify-center rounded-full bg-blue-600 text-sm font-black text-white shadow">
                            {posto + 1}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {!verificado && (
                  <button
                    type="button"
                    data-recipientes-verify
                    className="min-h-[54px] rounded-2xl border-2 border-blue-500 bg-blue-50 px-5 py-2 text-base font-black text-blue-800 shadow-sm focus-visible:outline-4 focus-visible:outline-blue-500"
                    onClick={onVerify}
                    disabled={disabled}
                    aria-label="Despejar para o mesmo recipiente e comparar"
                  >
                    🫗 Despejar para comparar
                  </button>
                )}

                {verificado && (
                  <motion.div
                    data-recipientes-standard
                    className="flex min-h-[116px] w-full items-end justify-center gap-4 rounded-2xl border-2 border-sky-200 bg-sky-50/70 px-4 py-3"
                    initial={{ opacity: 0, y: 8 }}
                    animate={{ opacity: 1, y: 0 }}
                  >
                    {itens.map((item, i) => (
                      <div key={`std-${item.id}`} className="flex flex-col items-center gap-1">
                        <div className="relative h-[86px] w-[42px] overflow-hidden rounded-b-xl border-[3px] border-slate-500 bg-white">
                          <motion.div
                            className="absolute inset-x-0 bottom-0 bg-sky-500/80"
                            initial={{ height: 0 }}
                            animate={{ height: `${Math.max(10, Math.round((item.valor / max) * 100))}%` }}
                            transition={{ duration: 0.8, delay: i * 0.12 }}
