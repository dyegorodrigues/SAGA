          cat > src/curriculum/procedimentos/medidasProcedure.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { Evidencia } from "../../constants/evidencias";
          import { MisconceptionTag } from "../../constants/misconceptions";
          import { AcaoDeMedida, diagnosticar, dominou, evidenciasDe } from "./medidasProcedure";

          const base: AcaoDeMedida = {
            modo: "peso", escolhido: 0, certo: 0, ordemCerta: [0, 1], ordemVisual: [1, 0],
            contraintuitivo: true, formatosDiferentes: false, verificou: true, maiorVisual: 1,
          };

          describe("F50 — diagnóstico e evidência", () => {
            it("colhe a evidência do caso contraintuitivo somente no acerto", () => {
              expect(evidenciasDe(base)).toEqual([Evidencia.CASO_CONTRAINTUITIVO]);
              expect(evidenciasDe({ ...base, escolhido: 1 })).toEqual([]);
            });
            it("nomeia julgamento pelo tamanho no peso", () => {
              expect(diagnosticar({ ...base, escolhido: 1 })).toBe(MisconceptionTag.JULGA_PELO_TAMANHO);
            });
            it("nomeia ignorar formato na capacidade antes da verificação", () => {
              expect(diagnosticar({ ...base, modo: "capacidade", escolhido: 1, formatosDiferentes: true, verificou: false })).toBe(MisconceptionTag.IGNORA_FORMATO);
            });
            it("domínio exige três acertos e pelo menos um contraintuitivo", () => {
              expect(dominou([base, { ...base, contraintuitivo: false }, { ...base, contraintuitivo: false }])).toBe(true);
              expect(dominou([{ ...base, contraintuitivo: false }, { ...base, contraintuitivo: false }, { ...base, contraintuitivo: false }])).toBe(false);
            });
          });
          EOF

          cat > src/curriculum/procedimentos/medidasContract.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { armadilhaReal, construirMedidasSpec, semEmpate } from "./medidasContract";

          const seq = (valores: number[]) => {
            let i = 0;
            return () => valores[(i++) % valores.length];
          };

          describe("F50 — escada de massa e capacidade", () => {
            it("L1 usa peso; L2 capacidade", () => {
              expect(construirMedidasSpec(1, seq([0.2, 0.7])).modo).toBe("peso");
              expect(construirMedidasSpec(2, seq([0.2, 0.7])).modo).toBe("capacidade");
            });
            it("L3 cria a armadilha de formato: altura aparente e capacidade discordam", () => {
              const s = construirMedidasSpec(3, seq([0.1, 0.8, 0.3]));
              expect(s.formatosDiferentes).toBe(true);
              expect(s.contraintuitivo).toBe(true);
              expect(s.ordemVisual[0]).not.toBe(s.ordemCerta[0]);
              expect(armadilhaReal(s)).toBe(true);
            });
            it("L4 garante o pequeno pesado contra o grande leve", () => {
              const s = construirMedidasSpec(4, seq([0.2, 0.8]));
              expect(s.modo).toBe("peso");
              expect(s.ordemVisual[0]).not.toBe(s.ordemCerta[0]);
              expect(armadilhaReal(s)).toBe(true);
            });
            it("L5 possui três grandezas distintas e pode sortear os dois modos", () => {
              const peso = construirMedidasSpec(5, seq([0.1, 0.2, 0.3, 0.4]));
              const capacidade = construirMedidasSpec(5, seq([0.9, 0.2, 0.3, 0.4]));
              expect(peso.modo).toBe("peso");
              expect(capacidade.modo).toBe("capacidade");
              expect(peso.itens).toHaveLength(3);
              expect(capacidade.itens).toHaveLength(3);
              expect(semEmpate(peso)).toBe(true);
              expect(semEmpate(capacidade)).toBe(true);
            });
          });
          EOF

      - name: Ligar F50 ao Composer, renderer, Radar e auditorias
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'âncora não encontrada em {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Kind autoral novo: palco composto Balanca + Recipientes.
          patch('src/curriculum/schema.ts', ' | "moldura";', ' | "moldura" | "medidas";')

          patch('src/constants/misconceptions.ts',
                '  SO_DIFERENCA_GRANDE: "so-diferenca-grande",\n\n  /* --- a moldura de dez',
                '  SO_DIFERENCA_GRANDE: "so-diferenca-grande",\n\n  /* --- massa e capacidade (ficha F50 / GM.12) ----------------------- */\n\n  /** Massa/capacidade: julgou pela aparência mesmo quando a referência contradizia. */\n  JULGA_PELO_TAMANHO: "julga-pelo-tamanho",\n\n  /** Massa: usou volume/tamanho aparente como substituto do peso. */\n  CONFUNDE_PESO_VOLUME: "confunde-peso-volume",\n\n  /** Capacidade: comparou a altura do líquido sem neutralizar o formato do recipiente. */\n  IGNORA_FORMATO: "ignora-formato",\n\n  /* --- a moldura de dez')

          patch('src/constants/evidencias.ts',
                '  DIFERENCA_PEQUENA: "diferenca-pequena",\n\n  /**\n   * F02',
                '  DIFERENCA_PEQUENA: "diferenca-pequena",\n\n  /**\n   * F50 (GM.12): um acerto em caso **contraintuitivo** — formato/tamanho aponta para o lado errado.\n   * A competência é conservação; sem este caso, três acertos óbvios não a provam.\n   */\n  CASO_CONTRAINTUITIVO: "caso-contraintuitivo",\n\n  /**\n   * F02')

          patch('src/types.ts',
                'source?: "vertical-column" | "array-grid";',
                'source?: "vertical-column" | "array-grid" | "medidas";')

          patch('src/curriculum/Composer.ts',
                'import { construirGrandezaSpec } from "./procedimentos/grandezaContract";',
                'import { construirGrandezaSpec } from "./procedimentos/grandezaContract";\nimport { construirMedidasSpec } from "./procedimentos/medidasContract";')
          patch('src/curriculum/Composer.ts',
                '''      case "touchplace": {''',
                '''      case "medidas": {\n        // F50/GM.12. Um único kind compõe as DUAS primitivas que a ficha nomeia:\n        // Balanca nos degraus de massa e Recipientes nos de capacidade.\n        const spec = construirMedidasSpec(lvl, Math.random);\n        answer = spec.seriacao ? "ordenado" : spec.resposta;\n        uiProps = spec;\n        evaluate = candidate => spec.seriacao ? candidate === "ordenado" : Number(candidate) === spec.resposta;\n        promptOverride = spec.enunciado;\n        options = undefined;\n        break;\n      }\n\n      case "touchplace": {''')

          patch('src/components/FichaRenderer.tsx',
                "import { GrandezaStage } from './primitives/GrandezaStage';",
                "import { GrandezaStage } from './primitives/GrandezaStage';\nimport { MedidasStage } from './primitives/MedidasStage';")
          patch('src/components/FichaRenderer.tsx',
                '''    case 'grandeza':\n      return <GrandezaStage spec={uiProps as never} onAnswer={valor => handleInteract(valor)} disabled={Boolean(disabled)} />;''',
                '''    case 'grandeza':\n      return <GrandezaStage spec={uiProps as never} onAnswer={valor => handleInteract(valor)} disabled={Boolean(disabled)} />;\n    case 'medidas':\n      return <MedidasStage spec={uiProps as never} onAnswer={(valor, meta) => onAnswer(valor, evaluate(valor), meta)} disabled={Boolean(disabled)} />;''')

          patch('src/components/gameloop/GameLoopExerciseRenderer.tsx',
                'import { GrandezaStage } from "../primitives/GrandezaStage";',
                'import { GrandezaStage } from "../primitives/GrandezaStage";\nimport { MedidasStage } from "../primitives/MedidasStage";')
          patch('src/components/gameloop/GameLoopExerciseRenderer.tsx',
                '  "grandeza",\n  "moldura",',
                '  "grandeza",\n  "medidas",\n  "moldura",')
          patch('src/components/gameloop/GameLoopExerciseRenderer.tsx',
                '''        {q.kind === "shapecanvas" && q.uiProps && "opcoes" in q.uiProps && (''',
                '''        {q.kind === "medidas" && q.uiProps && (\n          <MedidasStage\n            spec={q.uiProps as never}\n            falar={sound ? (t) => speak(t) : undefined}\n            onAnswer={(valor, meta) => handlePick(valor, undefined, meta)}\n            disabled={status !== null}\n            mostrar={typeof tutShow === "object" ? tutShow : null}\n          />\n        )}\n        {q.kind === "shapecanvas" && q.uiProps && "opcoes" in q.uiProps && (''')

          p = Path('src/components/gameloop/answerPolicy.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('|| (q.kind === "grandeza" && meta?.grandeza !== undefined);',
                        '|| (q.kind === "grandeza" && meta?.grandeza !== undefined)\n    || (q.kind === "medidas" && meta?.source === "medidas");', 2)
          if 'q.kind === "medidas"' not in s:
              raise SystemExit('falha ao ligar medidas à autoria de retry/feedback')
          s = s.replace('  if (q.kind === "grandeza" && meta?.grandeza !== undefined) {\n    // F49 §4: 1,8s de medida + 1,5s de fecho comparativo.\n    return 3300;\n  }',
                        '  if (q.kind === "grandeza" && meta?.grandeza !== undefined) {\n    // F49 §4: 1,8s de medida + 1,5s de fecho comparativo.\n    return 3300;\n  }\n  if (q.kind === "medidas" && meta?.source === "medidas") {\n    // F50 §4: verificação física + fecho sob referência comum.\n    return 3300;\n  }')
          s = s.replace('  "touchplace", "shapecanvas", "grandeza", "moldura",',
                        '  "touchplace", "shapecanvas", "grandeza", "medidas", "moldura",')
          p.write_text(s, encoding='utf-8')

          patch('src/curriculum/motores/composerCanary.ts',
                'import { GM_01 } from "../fichas/jornada/GM.01";',
                'import { GM_01 } from "../fichas/jornada/GM.01";\nimport { GM_12 } from "../fichas/jornada/GM.12";')
          patch('src/curriculum/motores/composerCanary.ts',
                '  "GM.01": GM_01,\n};',
                '  "GM.01": GM_01,\n\n  // GM.12/F50: massa e capacidade sem unidade. Implementada aqui, mas NÃO\n  // ativada — tela nova cumpre o mesmo intervalo de observação das anteriores.\n  "GM.12": GM_12,\n};')

          # Torna a ficha encontrável no catálogo autoral sem promovê-la a canário.
          patch('src/curriculum/fichas/index.ts',
                "import { GM_04 } from './jornada/GM.04';",
                "import { GM_04 } from './jornada/GM.04';\nimport { GM_12 } from './jornada/GM.12';")
          patch('src/curriculum/fichas/index.ts',
                'N4_02, GM_04, AL_01, AL_02, AL_05,',
                'N4_02, GM_04, GM_12, AL_01, AL_02, AL_05,', 2)

          # Mapa autoral: Recipientes deixa de ser dívida e passa a ser executável.
          p = Path('AI_Studio_Lab/tools/ficha_runtime_map.cjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('{ primitive: "Balanca", kinds: ["balanca"], componentFiles: [component("Balanca")], builderKinds: ["balanca"], rendererKinds: ["balanca"] },',
                        '{ primitive: "Balanca", kinds: ["balanca", "medidas"], componentFiles: [component("Balanca"), component("MedidasStage")], builderKinds: ["balanca", "medidas"], rendererKinds: ["balanca", "medidas"] },')
          old = '''  {\n    primitive: "Recipientes",\n    kinds: ["containers"],\n    componentFiles: [],\n    builderKinds: [],\n    rendererKinds: [],\n    note: "Planejada para F50/GM.12 (conservação/comparação sem unidades) e F61/GM.05 (capacidade graduada mL/L). Não reutilizar ShapeCanvas para líquidos.",\n  },'''
          new = '''  {\n    primitive: "Recipientes",\n    kinds: ["containers", "medidas"],\n    componentFiles: [component("Recipientes"), component("MedidasStage")],\n    builderKinds: ["medidas"],\n    rendererKinds: ["medidas"],\n    note: "F50/GM.12: conservação/comparação sem unidades; o mesmo componente poderá receber graduação apenas em GM.05.",\n  },'''
          if old not in s:
              raise SystemExit('bloco antigo de Recipientes não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/curriculum/conformidadeDeFichas.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('export const PRIMITIVAS_PENDENTES = ["Moedas", "Recipientes", "Regua"];',
                        'export const PRIMITIVAS_PENDENTES = ["Moedas", "Regua"];')
          s = s.replace('  balanca: ["Balanca"],', '  balanca: ["Balanca"],\n  medidas: ["Balanca", "Recipientes"],')
          p.write_text(s, encoding='utf-8')

          patch('src/curriculum/fichaRuntimeMap.test.ts',
                'expect(output).toContain("Recipientes: ausente");',
                'expect(output).toContain("Recipientes: executável");')

          # A sonda passa a medir os cinco degraus diretamente pela ficha ainda desligada.
          patch('sonda/cenas.tsx',
                'import { GM_01 } from "../src/curriculum/fichas/jornada/GM.01";',
                'import { GM_01 } from "../src/curriculum/fichas/jornada/GM.01";\nimport { GM_12 } from "../src/curriculum/fichas/jornada/GM.12";')
          patch('sonda/cenas.tsx',
                'export const CENAS: Cena[] = [',
                'export const CENAS: Cena[] = [\n  ...[1, 2, 3, 4, 5].map(lvl => ({\n    nome: `GM.12 F50 massa/capacidade (nível ${lvl})`,\n    render: (s: number) => <ExercicioDaFicha ficha={GM_12} lvl={lvl} semente={s} />,\n  })),')
          PY

          git diff --check

