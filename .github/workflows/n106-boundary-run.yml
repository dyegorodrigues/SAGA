name: Run N1.06 boundary patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run:
    if: github.head_ref == 'codex/corrigir-n106' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n106
      - name: Executar patch já versionado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('.github/workflows/n106-boundary-patch.yml').read_text()
          m = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", src, re.S)
          if not m:
              raise SystemExit('bloco Python do patch não encontrado')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          exec(compile(code, 'n106-boundary-patch', 'exec'))
          Path('.github/workflows/n106-boundary-run.yml').unlink()
          PY
          git diff --check
      - name: Commitar patch e remover bancadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: integra fluxo autoral F05 ao GameLoop'
          git push origin HEAD:codex/corrigir-n106
