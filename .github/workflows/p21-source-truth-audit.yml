name: P21 - fontes de verdade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventário derivado
        run: node AI_Studio_Lab/tools/p21_inventory.cjs
      - name: Capturar fiscais atuais sem interromper o relatório
        run: |
          set +e
          npm run auditar > /tmp/p21-auditar.txt 2>&1; echo $? > /tmp/p21-auditar.code
          npm run fichas:auditar > /tmp/p21-fichas-auditar.txt 2>&1; echo $? > /tmp/p21-fichas-auditar.code
          npm run fichas:conferir > /tmp/p21-fichas-conferir.txt 2>&1; echo $? > /tmp/p21-fichas-conferir.code
          npm run grafo:check > /tmp/p21-grafo.txt 2>&1; echo $? > /tmp/p21-grafo.code
          set -e
          node <<'NODE'
          const fs = require('fs');
          const p = 'AI_Studio_Lab/codex/AUDITORIA_P21_FONTES_DE_VERDADE.md';
          let md = fs.readFileSync(p, 'utf8');
          md += '\n## 8. Estado dos fiscais existentes\n\n';
          for (const name of ['auditar','fichas-auditar','fichas-conferir','grafo']) {
            const code = fs.readFileSync(`/tmp/p21-${name}.code`, 'utf8').trim();
            const out = fs.readFileSync(`/tmp/p21-${name}.txt`, 'utf8').trim();
            md += `### ${name} — exit ${code}\n\n\`\`\`text\n${out.slice(-5000)}\n\`\`\`\n\n`;
          }
          fs.writeFileSync(p, md);
          NODE
      - name: Sanidade do inventário
        run: |
          git diff --check
          npx tsc --noEmit
      - name: Publicar relatório e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p21_inventory.cjs .github/workflows/p21-source-truth-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P21: inventaria fontes de verdade atuais'
          git push origin HEAD:codex/integrar-bloco-f0
