name: Sync N1.06 sonda status

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'codex/corrigir-n106' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n106
          fetch-depth: 0
      - name: Aplicar patch cirúrgico na casca da sonda
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sonda/cenas.tsx')
          s = path.read_text()

          def rep(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'esperado 1, achei {n}: {old[:100]!r}')
              s = s.replace(old, new)

          rep(
              '  const [audioPromptVisible, setAudioPromptVisible] = React.useState(false);\n  React.useEffect(() => setAudioPromptVisible(false), [ficha.id, lvl, semente]);\n  return (',
              '''  const [audioPromptVisible, setAudioPromptVisible] = React.useState(false);
  const [statusDaCena, setStatusDaCena] = React.useState<"right" | null>(null);
  React.useEffect(() => {
    setAudioPromptVisible(false);
    setStatusDaCena(null);
  }, [ficha.id, lvl, semente]);

  // F05: erro autoral continua em retry (status nulo); só o acerto terminal
  // coloca a casca em `right`, como o GameLoop real faz antes do fecho.
  function responderDaFicha(valor: unknown) {
    if (q.kind === "audiochoice" && valor === q.answer) setStatusDaCena("right");
  }

  return ('''
          )
          rep(
              '{q.prompt && (q.kind !== "audiochoice" || audioPromptVisible) && (',
              '{q.prompt && statusDaCena === null && (q.kind !== "audiochoice" || audioPromptVisible) && ('
          )
          rep(
              '''    <GameLoopExerciseRenderer
      q={q} status={null} idx={0} handlePick={nada} timeLeft={30} promptDone
      guidedIdx={null} mockTutorialN={null} tutShow={(mostrar ?? null) as never}''',
              '''    <GameLoopExerciseRenderer
      q={q} status={statusDaCena} idx={0} handlePick={responderDaFicha} timeLeft={30} promptDone
      guidedIdx={null} mockTutorialN={null} tutShow={(mostrar ?? null) as never}'''
          )

          path.write_text(s)
          Path('.github/workflows/n106-sonda-status-sync.yml').unlink()
          PY
          git diff --check
      - name: Commitar somente na branch N1.06
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: sonda espelha status terminal da F05'
          git push origin HEAD:codex/corrigir-n106
