name: Fix GM12 visual semantics

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  fix:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Corrigir semântica de capacidade e referência comum de peso
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/curriculum/procedimentos/medidasContract.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''  emoji: string;\n  nome: string;''', '''  emoji: string;\n  nome: string;\n  /** Marca não verbal que acompanha o recipiente antes/depois do despejo. */\n  marcador?: string;''')
          old = '''  if (nivel === 2) {\n    return [\n      { id: "copo-a", emoji: "🥛", nome: "copo", valor: 0.38, tamanhoVisual: 1, largura: 1, altura: 1, preenchimento: 0.38 },\n      { id: "copo-b", emoji: "🥛", nome: "copo", valor: 0.72, tamanhoVisual: 1, largura: 1, altura: 1, preenchimento: 0.72 },\n    ];\n  }'''
          new = '''  if (nivel === 2) {\n    // Mesma forma, tamanhos diferentes, ambos CHEIOS: agora a pergunta mede\n    // capacidade (quanto cabe), não a quantidade de líquido já servida.\n    return [\n      { id: "copo-a", emoji: "🥛", nome: "copo menor", marcador: "●", valor: 0.38, tamanhoVisual: 0.78, largura: 0.78, altura: 0.78, preenchimento: 1 },\n      { id: "copo-b", emoji: "🥛", nome: "copo maior", marcador: "▲", valor: 0.72, tamanhoVisual: 1.12, largura: 1.12, altura: 1.12, preenchimento: 1 },\n    ];\n  }'''
          if old not in s: raise SystemExit('bloco L2 antigo não encontrado')
          s = s.replace(old, new, 1)
          old = '''  if (nivel === 3) {\n    // O estreito parece MAIS cheio, mas contém MENOS. É a armadilha da §2/§5.\n    return [\n      { id: "alto-fino", emoji: "🧪", nome: "copo alto e fino", valor: 0.46, tamanhoVisual: 1.12, largura: 0.62, altura: 1.22, preenchimento: 0.78 },\n      { id: "baixo-largo", emoji: "🥣", nome: "copo baixo e largo", valor: 0.72, tamanhoVisual: 1.28, largura: 1.30, altura: 0.82, preenchimento: 0.56 },\n    ];\n  }'''
          new = '''  if (nivel === 3) {\n    // Ambos estão cheios. O alto/fino chama a atenção pela ALTURA, mas sua\n    // capacidade é menor; despejar no mesmo recipiente neutraliza o formato.\n    return [\n      { id: "alto-fino", emoji: "🧪", nome: "recipiente alto e fino", marcador: "●", valor: 0.46, tamanhoVisual: 1.12, largura: 0.62, altura: 1.22, preenchimento: 1 },\n      { id: "baixo-largo", emoji: "🥣", nome: "recipiente baixo e largo", marcador: "▲", valor: 0.72, tamanhoVisual: 1.28, largura: 1.30, altura: 0.82, preenchimento: 1 },\n    ];\n  }'''
          if old not in s: raise SystemExit('bloco L3 antigo não encontrado')
          s = s.replace(old, new, 1)
          old = '''  // L5: três recipientes, e ordenar por altura aparente do líquido dá a ordem errada.\n  return [\n    { id: "fino", emoji: "🧪", nome: "recipiente fino", valor: 0.38, tamanhoVisual: 0.78, largura: 0.50, altura: 1.22, preenchimento: 0.80 },\n    { id: "largo", emoji: "🥣", nome: "recipiente largo", valor: 0.58, tamanhoVisual: 1.32, largura: 1.30, altura: 0.82, preenchimento: 0.47 },\n    { id: "medio", emoji: "🥛", nome: "recipiente médio", valor: 0.78, tamanhoVisual: 1.02, largura: 1.24, altura: 1.00, preenchimento: 0.63 },\n  ];'''
          new = '''  // L5: três recipientes CHEIOS. A ordem pela altura externa é diferente\n  // da ordem pela capacidade — a criança precisa recorrer à referência comum.\n  return [\n    { id: "fino", emoji: "🧪", nome: "recipiente fino", marcador: "●", valor: 0.38, tamanhoVisual: 0.78, largura: 0.50, altura: 1.22, preenchimento: 1 },\n    { id: "largo", emoji: "🥣", nome: "recipiente largo", marcador: "▲", valor: 0.58, tamanhoVisual: 1.32, largura: 1.30, altura: 0.82, preenchimento: 1 },\n    { id: "medio", emoji: "🥛", nome: "recipiente médio", marcador: "■", valor: 0.78, tamanhoVisual: 1.02, largura: 1.24, altura: 1.00, preenchimento: 1 },\n  ];'''
          if old not in s: raise SystemExit('bloco L5 capacidade antigo não encontrado')
          s = s.replace(old, new, 1)
          old = '''  const valorVisual = (i: ItemDeMedida) => modo === "capacidade"\n    ? (i.preenchimento ?? 0)\n    : i.tamanhoVisual;'''
          new = '''  const valorVisual = (i: ItemDeMedida) => modo === "capacidade"\n    // Em capacidade todos começam cheios: a armadilha visual é ALTURA/TAMANHO\n    // do recipiente, nunca "quanto líquido alguém já colocou".\n    ? (i.altura ?? i.tamanhoVisual)\n    : i.tamanhoVisual;'''
          if old not in s: raise SystemExit('valorVisual antigo não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/curriculum/procedimentos/medidasContract.test.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  it("L1 usa peso; L2 capacidade", () => {\n    expect(construirMedidasSpec(1, seq([0.2, 0.7])).modo).toBe("peso");\n    expect(construirMedidasSpec(2, seq([0.2, 0.7])).modo).toBe("capacidade");\n  });'''
          new = '''  it("L1 usa peso; L2 mede capacidade com a mesma forma, cheia, em tamanhos diferentes", () => {\n    expect(construirMedidasSpec(1, seq([0.2, 0.7])).modo).toBe("peso");\n    const s = construirMedidasSpec(2, seq([0.2, 0.7]));\n    expect(s.modo).toBe("capacidade");\n    expect(s.itens.every(i => i.preenchimento === 1)).toBe(true);\n    expect(new Set(s.itens.map(i => i.marcador)).size).toBe(s.itens.length);\n    const proporcoes = s.itens.map(i => (i.largura ?? 1) / (i.altura ?? 1));\n    expect(proporcoes[0]).toBeCloseTo(proporcoes[1], 5);\n    expect(s.itens[0].altura).not.toBe(s.itens[1].altura);\n  });'''
          if old not in s: raise SystemExit('teste L2 antigo não encontrado')
          s = s.replace(old, new, 1)
          old = '''    expect(s.formatosDiferentes).toBe(true);\n    expect(s.contraintuitivo).toBe(true);\n    expect(s.ordemVisual[0]).not.toBe(s.ordemCerta[0]);'''
          new = '''    expect(s.formatosDiferentes).toBe(true);\n    expect(s.contraintuitivo).toBe(true);\n    expect(s.itens.every(i => i.preenchimento === 1)).toBe(true);\n    expect(s.ordemVisual[0]).not.toBe(s.ordemCerta[0]);'''
          s = s.replace(old, new, 1)
          old = '''    expect(capacidade.itens).toHaveLength(3);\n    expect(semEmpate(peso)).toBe(true);\n    expect(semEmpate(capacidade)).toBe(true);'''
          new = '''    expect(capacidade.itens).toHaveLength(3);\n    expect(capacidade.itens.every(i => i.preenchimento === 1)).toBe(true);\n    expect(new Set(capacidade.itens.map(i => i.marcador)).size).toBe(3);\n    expect(capacidade.ordemVisual).not.toEqual(capacidade.ordemCerta);\n    expect(semEmpate(peso)).toBe(true);\n    expect(semEmpate(capacidade)).toBe(true);'''
          if old not in s: raise SystemExit('teste L5 antigo não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          cat > src/components/primitives/Recipientes.tsx <<'EOF'
          import React from "react";
          import { motion } from "motion/react";
          import { ItemDeMedida } from "../../curriculum/procedimentos/medidasContract";

          interface Props {
            itens: ItemDeMedida[];
            verificado: boolean;
            disabled?: boolean;
            ordem?: number[];
            onChoose?: (i: number) => void;
            onVerify?: () => void;
          }

          function dimensoes(item: ItemDeMedida, compacto: boolean) {
            const baseW = compacto ? 58 : 78;
            const baseH = compacto ? 92 : 126;
            return {
              width: Math.round(baseW * (item.largura ?? 1)),
              height: Math.round(baseH * (item.altura ?? 1)),
            };
          }

          function Marca({ item }: { item: ItemDeMedida }) {
            return (
              <span
                aria-hidden
                className="flex h-8 min-w-8 items-center justify-center rounded-full border-2 border-slate-300 bg-white px-1 text-lg font-black text-slate-800 shadow-sm"
              >
                {item.marcador ?? item.emoji}
              </span>
            );
          }

          export function Recipientes({ itens, verificado, disabled, ordem = [], onChoose, onVerify }: Props) {
            const max = Math.max(...itens.map(i => i.valor));
            const compacto = itens.length >= 3;
            return (
              <div className="flex w-full flex-col items-center gap-3" data-recipientes-stage>
                <div className="flex min-h-[164px] w-full items-end justify-center gap-3 px-1">
                  {itens.map((item, i) => {
                    const d = dimensoes(item, compacto);
                    const posto = ordem.indexOf(i);
                    return (
                      <button
                        key={item.id}
                        type="button"
                        className="relative flex min-h-[84px] min-w-[76px] flex-col items-center justify-end rounded-2xl p-1 focus-visible:outline-4 focus-visible:outline-blue-500 disabled:opacity-70"
                        aria-label={`${item.nome} ${i + 1}`}
                        disabled={disabled}
                        onClick={() => onChoose?.(i)}
                      >
                        <span className="relative block" style={{ width: d.width, height: d.height }}>
                          <span
                            aria-hidden
                            className="absolute inset-0 overflow-hidden border-[4px] border-slate-500 bg-white/70 shadow-inner"
                            style={{ borderRadius: `${Math.max(12, d.width * 0.22)}px ${Math.max(12, d.width * 0.22)}px ${Math.max(18, d.width * 0.38)}px ${Math.max(18, d.width * 0.38)}px` }}
                          >
                            <motion.span
                              className="absolute inset-x-0 bottom-0 block bg-sky-400/80"
                              initial={false}
                              animate={{ height: `${Math.round((item.preenchimento ?? 1) * 100)}%` }}
                              transition={{ duration: 0.7 }}
                            />
                          </span>
                          <span className="absolute -right-3 -top-4"><Marca item={item} /></span>
                        </span>
                        {posto >= 0 && (
                          <span className="absolute right-0 top-0 flex h-7 w-7 items-center justify-center rounded-full bg-blue-600 text-sm font-black text-white shadow">
                            {posto + 1}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {!verificado && (
                  <button
                    type="button"
                    data-recipientes-verify
                    className="min-h-[54px] rounded-2xl border-2 border-blue-500 bg-blue-50 px-5 py-2 text-base font-black text-blue-800 shadow-sm focus-visible:outline-4 focus-visible:outline-blue-500"
                    onClick={onVerify}
                    disabled={disabled}
                    aria-label="Despejar para recipientes iguais e comparar"
                  >
                    🫗 Despejar e comparar
                  </button>
                )}

                {verificado && (
                  <motion.div
                    data-recipientes-standard
                    aria-label="As quantidades foram despejadas em recipientes iguais"
                    className="flex min-h-[122px] w-full items-end justify-center gap-4 rounded-2xl border-2 border-sky-200 bg-sky-50/70 px-4 py-3"
                    initial={{ opacity: 0, y: 8 }}
                    animate={{ opacity: 1, y: 0 }}
                  >
                    {itens.map((item, i) => (
                      <div key={`std-${item.id}`} className="flex flex-col items-center gap-1">
                        <div className="relative h-[86px] w-[42px] overflow-hidden rounded-b-xl border-[3px] border-slate-500 bg-white">
                          <motion.div
                            className="absolute inset-x-0 bottom-0 bg-sky-500/80"
                            initial={{ height: 0 }}
                            animate={{ height: `${Math.max(10, Math.round((item.valor / max) * 100))}%` }}
                            transition={{ duration: 0.8, delay: i * 0.12 }}
                          />
                        </div>
                        <Marca item={item} />
                      </div>
                    ))}
                  </motion.div>
                )}
              </div>
            );
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/primitives/MedidasStage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''function ReferenciaDePeso({ valor }: { valor: number }) {\n  const angulo = Math.max(-12, Math.min(12, (valor - 5) * 3));\n  return (\n    <span className="relative mt-1 block h-7 w-16" aria-hidden>\n      <span className="absolute bottom-1 left-1/2 h-5 w-[3px] -translate-x-1/2 bg-slate-400" />\n      <span className="absolute left-1/2 top-2 h-[3px] w-14 -translate-x-1/2 rounded bg-slate-500" style={{ transform: `translateX(-50%) rotate(${angulo}deg)` }} />\n      <span className="absolute left-1 top-4 h-2 w-4 rounded-b-full border-2 border-slate-400" />\n      <span className="absolute right-1 top-4 h-2 w-4 rounded-b-full border-2 border-slate-400" />\n    </span>\n  );\n}'''
          new = '''function ComparadorDePeso({ emoji, escala, valor }: { emoji: string; escala: number; valor: number }) {\n  // L5 reaproveita a linguagem visual dos níveis 1/4: cada objeto é pesado\n  // contra a MESMA referência neutra. Não há número nem unidade na tela.\n  const referencia = 5;\n  const angulo = Math.max(-12, Math.min(12, (referencia - valor) * 3.5));\n  return (\n    <span className="relative mx-auto mt-1 block h-[78px] w-[92px]" aria-hidden data-peso-referencia-comum>\n      <span className="absolute bottom-1 left-1/2 h-8 w-[4px] -translate-x-1/2 rounded bg-slate-400" />\n      <span className="absolute bottom-0 left-1/2 h-0 w-0 -translate-x-1/2 border-x-[10px] border-b-[18px] border-x-transparent border-b-slate-300" />\n      <motion.span\n        className="absolute left-1/2 top-8 block h-[4px] w-[82px] -translate-x-1/2 rounded bg-slate-600"\n        initial={false}\n        animate={{ rotate: angulo }}\n        transition={{ type: "spring", stiffness: 140, damping: 14 }}\n        style={{ transformOrigin: "50% 50%" }}\n      >\n        <span className="absolute -left-1 -top-8 flex h-8 min-w-8 items-center justify-center rounded-lg border-2 border-slate-300 bg-white shadow-sm" style={{ fontSize: `${Math.round(20 * escala)}px` }}>{emoji}</span>\n        <span className="absolute -right-1 -top-8 flex h-8 w-8 items-center justify-center rounded-lg border-2 border-slate-400 bg-slate-200 text-base shadow-sm">◆</span>\n        <span className="absolute -left-2 top-2 h-3 w-10 rounded-b-full border-x-2 border-b-2 border-slate-400" />\n        <span className="absolute -right-2 top-2 h-3 w-10 rounded-b-full border-x-2 border-b-2 border-slate-400" />\n      </motion.span>\n    </span>\n  );\n}'''
          if old not in s: raise SystemExit('ReferenciaDePeso antiga não encontrada')
          s = s.replace(old, new, 1)
          old = '''                  <span aria-hidden className="block leading-none" style={{ fontSize: `${Math.round(44 * item.tamanhoVisual)}px` }}>{item.emoji}</span>\n                  <ReferenciaDePeso valor={item.valor} />'''
          new = '''                  <ComparadorDePeso emoji={item.emoji} escala={item.tamanhoVisual} valor={item.valor} />'''
          if old not in s: raise SystemExit('uso antigo da referência não encontrado')
          s = s.replace(old, new, 1)
          s = s.replace('className="relative min-h-[132px] rounded-2xl', 'className="relative min-h-[126px] rounded-2xl', 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check

      - name: Provar contratos e runtime
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run src/curriculum/procedimentos/medidasContract.test.ts src/curriculum/procedimentos/medidasProcedure.test.ts src/curriculum/evidenciaDaFicha.test.ts src/curriculum/conformidadeDeFichas.test.ts
          npm test -- --run
          npm run build

      - name: Instalar Chromium compatível
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Sonda e prints corrigidos
        run: |
          npm run sonda -- "GM.12"
          rm -rf /tmp/gm12-fixed
          for largura in 320 390 900; do
            PRINTS_LARGURA="$largura" PRINTS_OUT="/tmp/gm12-fixed/$largura" node scripts/prints.mjs "GM.12"
          done

      - name: Publicar prints para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: gm12-visual-qa-fixed
          path: /tmp/gm12-fixed
          if-no-files-found: error
          retention-days: 7

      - name: Publicar correção e apagar bancada
        run: |
          rm .github/workflows/fix-gm12-visual-semantics.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src .github/workflows/fix-gm12-visual-semantics.yml
          git diff --cached --check
          git commit -m 'GM.12: mede capacidade cheia e reutiliza referência comum de peso'
          git push origin HEAD:codex/integrar-bloco-f0
