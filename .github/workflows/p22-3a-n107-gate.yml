''')

          Path('src/curriculum/fichas/jornada/N1.07.test.ts').write_text('''import { describe, expect, it } from "vitest";
import { Composer } from "../../Composer";
import { misconceptionForAnswer } from "../../../components/gameloop/answerPolicy";
import { N1_07 } from "./N1.07";

function amostrar(level: number, vezes = 120) {
  return Array.from({ length: vezes }, () => Composer.generate(N1_07, level));
}

describe("N1.07 — ordem, sucessor e antecessor", () => {
  it("usa os pré-requisitos canônicos do grafo", () => {
    expect(N1_07.prereqs).toEqual(["N1.02", "N1.06"]);
  });

  it("serve exatamente cinco micros, um por nível", () => {
    expect(N1_07.micros.map(m => m.id)).toEqual(["a", "b", "c", "d", "e"]);
    for (let level = 1; level <= 5; level += 1) {
      const q = Composer.generate(N1_07, level);
      expect(q.isFallback).toBeFalsy();
      expect(q.evaluate?.(q.answer)).toBe(true);
      expect(q.options?.filter(o => String(o.value) === String(q.answer))).toHaveLength(1);
    }
  });

  it("níveis 1 e 2 observam sucessor dentro do escopo", () => {
    for (const level of [1, 2]) {
      const max = level === 1 ? 5 : 10;
      for (const q of amostrar(level)) {
        expect(q.kind).toBe("numberline");
        expect(q.nlStartPos).toBeTypeOf("number");
        expect(Number(q.answer)).toBe(Number(q.nlStartPos) + 1);
        expect(Number(q.answer)).toBeLessThanOrEqual(max);
      }
    }
  });

  it("nível 3 observa antecessor com a reta até 5", () => {
    for (const q of amostrar(3)) {
      expect(q.kind).toBe("numberline");
      expect(Number(q.answer)).toBe(Number(q.nlStartPos) - 1);
      expect(Number(q.answer)).toBeGreaterThanOrEqual(1);
      expect(Number(q.nlStartPos)).toBeLessThanOrEqual(5);
    }
  });

  it("nível 4 observa antecessor sem depender da reta", () => {
    for (const q of amostrar(4)) {
      expect(q.kind).toBe("plain");
      expect(q.nlStartPos).toBeUndefined();
      const atual = Number(String(q.big).split("→").at(-1)?.trim());
      expect(Number(q.answer)).toBe(atual - 1);
      expect(Number(q.answer)).toBeGreaterThanOrEqual(1);
    }
  });

  it("nível 5 ordena 3–4 numerais e diagnostica somente erros", () => {
    for (const q of amostrar(5, 160)) {
      expect(q.kind).toBe("plain");
      const resposta = String(q.answer);
      const numeros = resposta.split("→").map(v => Number(v.trim()));
      expect([3, 4]).toContain(numeros.length);
      expect(numeros).toEqual([...numeros].sort((a, b) => a - b));
      expect(new Set(numeros).size).toBe(numeros.length);
      expect(misconceptionForAnswer(q, q.answer)).toBeUndefined();
      for (const option of q.options ?? []) {
        if (String(option.value) === resposta) continue;
        expect(option.misconception).toBe("ORDEM_ERRADA");
      }
    }
  });

  it("nenhum nível oferece mais de quatro alternativas nem número negativo", () => {
    for (let level = 1; level <= 5; level += 1) {
      for (const q of amostrar(level)) {
        expect(q.options?.length ?? 0).toBeGreaterThanOrEqual(2);
        expect(q.options?.length ?? 0).toBeLessThanOrEqual(4);
        for (const option of q.options ?? []) {
          if (typeof option.value === "number") expect(option.value).toBeGreaterThanOrEqual(0);
        }
      }
    }
  });
});
''')

          canon_path = Path('AI_Studio_Lab/pedagogia/fichas/FICHAS_F0_COMPLETAS.md')
          canon = canon_path.read_text()
          old_identity = '**Competência:** N1.07 (sucessor e antecessor) · **Primitiva:** `AudioChoice` + `NumberLine` · **Faixa:** F0 · **Também é trilha do Dojo (JD4)**'
          new_identity = '**Competência:** N1.07 (ordem, sucessor e antecessor) · **Primitiva:** `AudioChoice` + `NumberLine` + `plain` · **Faixa:** F0 · **Também é trilha do Dojo (JD4)**'
          if old_identity not in canon:
            raise SystemExit('identidade JD4 não encontrada; abortando patch')
          canon = canon.replace(old_identity, new_identity, 1)
          foundation = '**O que a criança aprende:** que cada número tem um **próximo fixo** — e que "próximo" significa "mais um".\n'
          addition = foundation + '\n**Escopo da Jornada N1.07:** o grafo canônico é mais amplo que a trilha de fluência JD4: além de sucessor/antecessor, a Jornada observa **ordenar 3–4 numerais em ordem crescente**. JD4 continua focada em automaticidade da vizinhança numérica; não substitui essa compreensão.\n'
          if foundation not in canon:
            raise SystemExit('fundamento JD4 não encontrado; abortando patch')
          canon = canon.replace(foundation, addition, 1)
          canon_path.write_text(canon)
          PY
      - name: Contratos focais N1.07
        run: |
          npx vitest run \
            src/curriculum/fichas/jornada/N1.07.test.ts \
            src/curriculum/motores/canaryContract.test.ts
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
      - name: Sonda N1.07
