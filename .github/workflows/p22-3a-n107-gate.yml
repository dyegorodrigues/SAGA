    2: { primitiva: "numberline", micro: "b", andaime: "alto" },
    3: { primitiva: "numberline", micro: "c", andaime: "medio" },
    4: { primitiva: "plain", micro: "d", andaime: "minimo" },
    5: { primitiva: "plain", micro: "e", rt_alvo: 3000 },
