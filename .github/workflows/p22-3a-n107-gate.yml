name: P22.3A - N1.07 Journey gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar patch cirurgico N1.07
        run: |
          python - <<'PY'
          from pathlib import Path

          composer_path = Path('src/curriculum/Composer.ts')
          composer = composer_path.read_text()

          old_numberline = '''        case "numberline": {
          const start = requireNumber(params.start, `start em ${micro.id}`);
          const end = requireNumber(params.end, `end em ${micro.id}`);
          const jump = requireNumber(params.jump_size, `jump_size em ${micro.id}`);
          if (end <= start || jump <= 0 || jump > end - start) {
            throw new Error(`Intervalo inválido para numberline em ${micro.id}.`);
          }
          const current = randomInt(start, end - jump);
          const next = current + jump;
          const options = numericOptions(next, [current, next + jump, current - jump], start, end, {
            preferredCount: 3,
            diagnoses: [
              { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === next + jump },
              { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current - jump },
            ],
          });
          return {
            ...base,
            kind: "numberline",
            prompt: "Para onde o sapinho deve pular?",
            big: String(current),
            nlStart: start,
            nlEnd: end,
            nlStartPos: current,
            uiProps: { ...params, start, end, startPos: current, showJumps: [{ from: current, to: next }] },
            options: tagNumericDistractors(options, next, ficha.distratores),
            answer: next,
            evaluate: ans => Number(ans) === next,
          };
        }
'''

          new_numberline = '''        case "numberline": {
          const start = requireNumber(params.start, `start em ${micro.id}`);
          const end = requireNumber(params.end, `end em ${micro.id}`);
          const jump = requireNumber(params.jump_size, `jump_size em ${micro.id}`);
          if (end <= start || jump <= 0 || jump > end - start) {
            throw new Error(`Intervalo inválido para numberline em ${micro.id}.`);
          }

          // P22.3A — N1.07 usa a mesma reta para ensinar as duas direções.
          // O modo default continua sendo sucessor, preservando qualquer ficha
          // antiga que não declare `modo`.
          const modo = params.modo === "antecessor" ? "antecessor" : "sucessor";
          const current = modo === "antecessor"
            ? randomInt(start + jump, end)
            : randomInt(start, end - jump);
          const target = modo === "antecessor" ? current - jump : current + jump;
          const candidates = modo === "antecessor"
            ? [current, current + jump, current - (2 * jump)]
            : [current, current + (2 * jump), current - jump];
          const options = numericOptions(target, candidates, start, end, {
            preferredCount: 3,
            diagnoses: modo === "antecessor"
              ? [
                  { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === current },
                  { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current + jump },
                ]
              : [
                  { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === current },
                  { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current - jump },
                ],
          });
          const prompt = params.audio_prompt
            ?? (modo === "antecessor" ? "Qual número vem antes?" : "Qual número vem depois?");
          return {
            ...base,
            kind: "numberline",
            prompt,
            big: modo === "antecessor" ? `? → ${current}` : `${current} → ?`,
            nlStart: start,
            nlEnd: end,
            nlStartPos: current,
            uiProps: { ...params, start, end, startPos: current, showJumps: [{ from: current, to: target }] },
            options,
            answer: target,
            evaluate: ans => Number(ans) === target,
            howto: modo === "antecessor"
              ? "Na reta, volte um passo para achar o número que vem antes."
              : "Na reta, avance um passo para achar o número que vem depois.",
            explain: modo === "antecessor"
              ? "O antecessor é o vizinho imediatamente à esquerda."
              : "O sucessor é o vizinho imediatamente à direita.",
          };
        }
'''
          if old_numberline not in composer:
            raise SystemExit('âncora numberline não encontrada; abortando patch')
          composer = composer.replace(old_numberline, new_numberline, 1)

          plain_anchor = '''        case "plain": {
          const fixedAnswer = params.answer;
'''
          plain_insert = '''        case "plain": {
          // P22.3A — modos conceituais de N1.07 depois da retirada da reta.
          // Ficam opt-in por `modo`; o comportamento genérico de `plain`
          // permanece intocado para todas as outras fichas.
          if (params.modo === "antecessor" || params.modo === "sucessor") {
            const start = requireNumber(params.start, `start em ${micro.id}`);
            const end = requireNumber(params.end, `end em ${micro.id}`);
            if (end <= start) throw new Error(`Intervalo inválido para vizinhança em ${micro.id}.`);
            const antecessor = params.modo === "antecessor";
            const current = antecessor ? randomInt(start + 1, end) : randomInt(start, end - 1);
            const answer = antecessor ? current - 1 : current + 1;
            const options = numericOptions(
              answer,
              antecessor ? [current, current + 1, current - 2] : [current, current + 2, current - 1],
              start,
              end,
              {
                preferredCount: 3,
                diagnoses: antecessor
                  ? [
                      { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === current },
                      { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current + 1 },
                    ]
                  : [
                      { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === current },
                      { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current - 1 },
                    ],
              },
            );
            const prompt = params.audio_prompt
              ?? (antecessor ? "Qual número vem antes?" : "Qual número vem depois?");
            const big = antecessor ? `? → ${current}` : `${current} → ?`;
            return {
              ...base,
              kind: "plain",
              prompt,
              big,
              options,
              answer,
              uiProps: { ...params, text: big },
              evaluate: ans => Number(ans) === answer,
              howto: antecessor
                ? "Pense na contagem ao contrário: qual vizinho vem antes?"
                : "Pense na contagem para frente: qual vizinho vem depois?",
              explain: antecessor
                ? "O antecessor é sempre um a menos."
                : "O sucessor é sempre um a mais.",
            };
          }

          if (params.modo === "ordenacao") {
            const start = requireNumber(params.start, `start em ${micro.id}`);
            const end = requireNumber(params.end, `end em ${micro.id}`);
            if (end - start < 3) throw new Error(`Intervalo curto demais para ordenação em ${micro.id}.`);
            const count = Math.random() < 0.5 ? 3 : 4;
            const first = randomInt(start, end - count + 1);
            const ascending = Array.from({ length: count }, (_, index) => first + index);
            const correct = ascending.join(" → ");
            const reversed = [...ascending].reverse();
            const swapped = [...ascending];
            [swapped[0], swapped[1]] = [swapped[1], swapped[0]];
            const rotated = [...ascending.slice(1), ascending[0]];
            const candidateSequences = [ascending, reversed, swapped, rotated]
              .map(sequence => sequence.join(" → "));
            const uniqueSequences = Array.from(new Set(candidateSequences));
            const options = shuffleOptions(uniqueSequences.slice(0, 4).map(sequence => ({
              label: sequence,
              value: sequence,
              ...(sequence === correct ? {} : { misconception: MisconceptionTag.ORDEM_ERRADA }),
            })));
            const cards = shuffleOptions(ascending.map(value => ({ label: String(value), value })))
              .map(option => option.value);
            return {
              ...base,
              kind: "plain",
              prompt: params.audio_prompt ?? "Coloque os números do menor para o maior.",
              big: cards.join("   "),
              options,
              answer: correct,
              uiProps: { ...params, text: cards.join("   "), cards },
              evaluate: ans => String(ans) === correct,
              howto: "Comece pelo menor e siga a ordem da contagem.",
              explain: "Ordenar é colocar os números na mesma ordem em que aparecem quando contamos.",
            };
          }

          const fixedAnswer = params.answer;
'''
          if plain_anchor not in composer:
            raise SystemExit('âncora plain não encontrada; abortando patch')
          composer = composer.replace(plain_anchor, plain_insert, 1)
          composer_path.write_text(composer)

          Path('src/curriculum/fichas/jornada/N1.07.ts').write_text('''import { FichaCompetencia } from "../../schema";

/**
 * N1.07 — ordem, sucessor e antecessor até 10.
 *
 * P22.3A separa duas responsabilidades que estavam misturadas:
 * - Jornada: ENSINA/OBSERVA sucessor, antecessor e ordenação, como o grafo promete;
 * - Jardim JD4: depois automatiza vizinhança numérica, sem substituir compreensão.
 */
export const N1_07: FichaCompetencia = {
  id: "N1.07",
  nome: "Ordem, sucessor e antecessor até 10",
  strand: "N1",
  faixa: "F0",
  prereqs: ["N1.02", "N1.06"],
  bncc: "EF01MA01",

  howto: "Use a ordem da contagem para descobrir quem vem antes, quem vem depois e como colocar os números em sequência.",
  explain: "Cada número tem vizinhos fixos: o antecessor vem imediatamente antes e o sucessor imediatamente depois.",

  niveis: {
