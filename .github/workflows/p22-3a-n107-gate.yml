          npm test -- --run
          npm run build
          npm run pr:check
          git diff --check e2ee44d1d79d910ebbfcb3411d5f65c836616a47..HEAD
      - name: Publicar se verde; descartar se vermelho
        if: always()
        run: |
          STATUS='${{ job.status }}'
          if [ "$STATUS" != 'success' ]; then
            git reset --hard HEAD
          fi
          rm .github/workflows/p22-3a-n107-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          if [ "$STATUS" = 'success' ]; then
            git commit -m 'P22.3A: completa Jornada N1.07'
          else
            git commit -m 'chore: remove bancada temporaria P22.3A apos falha'
          fi
          git push origin HEAD:codex/integrar-bloco-f0
