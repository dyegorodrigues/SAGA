name: P21.2 - runtime map gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Portoes P21.2
        run: |
          npm run fichas:auditar | tee /tmp/p21-2-fichas.txt
          grep -F 'Grupo: executável' /tmp/p21-2-fichas.txt
          grep -F 'StoryPanel: executável' /tmp/p21-2-fichas.txt
          grep -F 'DragGroup: executável | kinds=draggroup+pareamento+classificacao | builder=draggroup+pareamento+classificacao | renderer=draggroup+pareamento+classificacao' /tmp/p21-2-fichas.txt
          grep -F 'EmojiRow: executável | kinds=emojirow+fileira+moldura | builder=emojirow+fileira+moldura | renderer=emojirow+fileira+moldura' /tmp/p21-2-fichas.txt
          grep -F 'TenFrame: executável | kinds=tenframe+moldura+bond+plain | builder=tenframe+moldura+bond+plain | renderer=tenframe+moldura+bond+plain' /tmp/p21-2-fichas.txt
          grep -F 'Quadrado100: componente-isolado' /tmp/p21-2-fichas.txt
          grep -F 'Regua: ausente' /tmp/p21-2-fichas.txt
          grep -F -- '- executável: 20' /tmp/p21-2-fichas.txt
          grep -F -- '- renderer-sem-builder: 4' /tmp/p21-2-fichas.txt
          grep -F -- '- componente-isolado: 1' /tmp/p21-2-fichas.txt
          grep -F -- '- ausente: 1' /tmp/p21-2-fichas.txt
          npx vitest run src/curriculum/fichaRuntimeMap.test.ts
          npm run auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npm test -- --run
          npm run build
          npm run pr:check
          git diff --check e2ee44d1d79d910ebbfcb3411d5f65c836616a47..HEAD
      - name: Limpar bancada temporaria
        if: always()
        run: |
          rm .github/workflows/p21-2-runtime-map-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove bancada temporaria P21.2 gate'
          git push origin HEAD:codex/integrar-bloco-f0
