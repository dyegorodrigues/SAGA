name: Fix N106 post audio prompt

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  fix:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Alinhar o prompt ao estado pós-audição
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/curriculum/procedimentos/audioChoiceProcedure.ts')
          s = p.read_text(encoding='utf-8')
          old = '  audioPrompt: "Aperte e escute. Que número você ouviu?",'
          new = '  // A primeira audição normal é automática; quando este prompt aparece, ela já ouviu.\n  audioPrompt: "Que número você ouviu?",'
          if old not in s:
              raise SystemExit('audioPrompt antigo da F05 não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('AI_Studio_Lab/pedagogia/fichas/FICHAS_F0_COMPLETAS.md')
          s = p.read_text(encoding='utf-8')
          old = '**audioPrompt:** *"Aperte e escute. Que número você ouviu?"*'
          new = '**audioPrompt (após a primeira audição automática):** *"Que número você ouviu?"*'
          if old not in s:
              raise SystemExit('audioPrompt antigo não encontrado no cânone F05')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/curriculum/procedimentos/audioChoiceProcedure.test.ts')
          s = p.read_text(encoding='utf-8')
          anchor = '''describe("§7 — as falas são as da ficha, letra por letra", () => {\n'''
          test = '''  it("o prompt normal é pós-audição: não manda apertar depois do autoplay", () => {\n    expect(FALAS.audioPrompt).toBe("Que número você ouviu?");\n    expect(FALAS.audioPrompt.toLowerCase()).not.toContain("aperte");\n    expect(FALAS.howto.toLowerCase()).toContain("aperte");\n  });\n\n'''
          if test not in s:
              if anchor not in s: raise SystemExit('âncora §7 do teste F05 ausente')
              s = s.replace(anchor, anchor + test, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Provar a F05 e regressão geral
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run src/curriculum/procedimentos/audioChoiceProcedure.test.ts src/components/primitives/AudioChoiceStage.f05.test.tsx src/curriculum/evidenciaDaFicha.test.ts
          npm test -- --run
          npm run build

      - name: Instalar Chromium e capturar o estado corrigido
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          rm -rf /tmp/n106-prompt
          PRINTS_LARGURA=320 PRINTS_WAIT_MS=2800 PRINTS_OUT=/tmp/n106-prompt node scripts/prints.mjs "N1.06"

      - name: Publicar QA visual
        uses: actions/upload-artifact@v4
        with:
          name: n106-post-audio-prompt
          path: /tmp/n106-prompt
          if-no-files-found: error
          retention-days: 7

      - name: Publicar correção e remover bancada
        run: |
          rm .github/workflows/fix-n106-post-audio-prompt.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src AI_Studio_Lab/pedagogia/fichas/FICHAS_F0_COMPLETAS.md .github/workflows/fix-n106-post-audio-prompt.yml
          git diff --cached --check
          git commit -m 'N1.06: prompt normal passa a descrever o estado pós-audição'
          git push origin HEAD:codex/integrar-bloco-f0
