name: Audit P18 kinds v3

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  audit:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Reexecutar auditor AST dentro do repositório
        run: |
          git show 8dd7754427f5e685a7270d3e92ff27e551b4dbea:.github/workflows/audit-p18-kinds-v2.yml > /tmp/p18-source.yml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const source = YAML.parse(fs.readFileSync('/tmp/p18-source.yml', 'utf8'));
          const step = source.jobs.audit.steps.find(s => s.name === 'Auditar declarações reais via AST');
          if (!step?.run) throw new Error('script AST da P18 não encontrado');
          let run = step.run
            .replaceAll('/tmp/p18-audit.mjs', '.p18-audit.mjs')
            .replace('cat AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md', 'rm .p18-audit.mjs\ncat AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md');
          fs.writeFileSync('/tmp/run-p18-v3.sh', run, { mode: 0o700 });
          NODE
          bash /tmp/run-p18-v3.sh

      - name: Provar contrato atual
        run: |
          npx vitest run src/curriculum/kindComBuilder.test.ts
          npm run fichas:auditar

      - name: Publicar auditoria precisa e remover bancada
        run: |
          rm .github/workflows/audit-p18-kinds-v3.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md .github/workflows/audit-p18-kinds-v3.yml
          git diff --cached --check
          git commit -m 'P18: separa declarações autorais reais de comentários e legado'
          git push origin HEAD:codex/integrar-bloco-f0
