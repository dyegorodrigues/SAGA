name: P20 - isolamento de identidade do save

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  identity:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar arquitetura P20
        run: python AI_Studio_Lab/tools/p20_identity_apply.py
      - name: Contratos e testes focais
        run: |
          git diff --check
          npx tsc --noEmit
          npx vitest run \
            src/lib/storageIdentity.test.ts \
            src/lib/bootstrapState.test.ts \
            src/lib/reconciliacaoDeSaves.test.ts \
            src/lib/sincronizadorDeNuvem.test.ts \
            src/lib/storageIsolationContract.test.ts \
            src/utils/migrator.test.ts
      - name: Suite completa e build
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run grafo:check
          npm test -- --run
          npm run build
      - name: Publicar P20 aprovado e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p20_identity_apply.py .github/workflows/p20-state-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P20: isola save local e sync por Firebase UID'
          git push origin HEAD:codex/integrar-bloco-f0
