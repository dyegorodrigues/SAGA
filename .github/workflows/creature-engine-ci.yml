name: Creature Engine CI

on:
  pull_request:
    paths:
      - "src/features/creature-engine/**"
      - "src/creature-lab-main.tsx"
      - "creature-lab.html"
      - "vite.config.ts"
      - "src/components/home/PerfilTab.tsx"
      - "server.ts"
      - "server/services/creatureSpriteService*"
      - "scripts/creature-pmd-smoke.cjs"
      - "package.json"
      - "docs/CREATURE_ENGINE.md"
      - "docs/GOOGLE_AI_STUDIO_CREATURE_ENGINE.md"
      - ".github/workflows/creature-engine-ci.yml"
  workflow_dispatch:

concurrency:
  group: creature-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Creature Engine focused tests
        run: npm run test:creature

      - name: Full test suite
        run: npm test

      - name: Catalog audit
        run: npm run auditar

      - name: Worksheet audit
        run: npm run fichas:auditar

      - name: Knowledge graph consistency
        run: npm run grafo:check

      - name: Production build
        run: npm run build

      - name: Verify Creature Lab build entry
        run: test -f dist/creature-lab.html

      - name: Text-only pull request guard
        env:
          PR_BASE: origin/${{ github.base_ref || 'main' }}
        run: npm run pr:check

      - name: PMDCollab integration smoke
        run: npm run test:creature:smoke
