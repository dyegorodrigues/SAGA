name: Visual QA GM12

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  capture:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium compatível
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Capturar GM.12 em três larguras
        run: |
          rm -rf /tmp/gm12-prints
          for largura in 320 390 900; do
            PRINTS_LARGURA="$largura" PRINTS_OUT="/tmp/gm12-prints/$largura" node scripts/prints.mjs "GM.12"
          done
          find /tmp/gm12-prints -type f -name '*.png' -print | sort
      - name: Publicar artefato de inspeção
        uses: actions/upload-artifact@v4
        with:
          name: gm12-visual-qa
          path: /tmp/gm12-prints
          if-no-files-found: error
          retention-days: 7
      - name: Apagar bancada do repositório
        run: |
          rm .github/workflows/visual-qa-gm12.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add .github/workflows/visual-qa-gm12.yml
          git commit -m 'higiene: remove bancada visual temporaria da GM.12'
          git push origin HEAD:codex/integrar-bloco-f0
