name: Fix AL01 evidence

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  fix:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Ligar a prova do não pertence ponta a ponta
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'âncora não encontrada em {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          patch(
              'src/curriculum/procedimentos/classificacaoProcedure.ts',
              'import { MisconceptionTag, MisconceptionTagType } from "../../constants/misconceptions";',
              'import { Evidencia } from "../../constants/evidencias";\nimport { MisconceptionTag, MisconceptionTagType } from "../../constants/misconceptions";',
          )

          marker = '''/* ------------------------------------------------------------------ *\n *  §7 — as falas, transcritas\n * ------------------------------------------------------------------ */'''
          evidence_fn = '''/**\n * §9 — a prova específica da F51.\n *\n * O palco só encerra quando todas as peças têm um destino correto, mas esta\n * função não confia nessa propriedade implícita: se receber uma ação final\n * inconsistente, não emite evidência. Recuperar de uma tentativa recusada não\n * invalida a prova — a ficha exige uma peça corretamente deixada fora, não uma\n * rodada sem erro anterior.\n */\nexport function evidenciasDe(a: AcaoDeClassificacao): string[] {\n  const rodadaCorreta = a.colocacoes.every(c => {\n    const certo = destinoCerto(c.peca, a.criterios);\n    return certo.length === c.onde.length && certo.every(i => c.onde.includes(i));\n  });\n  if (!rodadaCorreta) return [];\n\n  const decidiuNaoPertence = a.colocacoes.some(c =>\n    destinoCerto(c.peca, a.criterios).length === 0 && c.onde.length === 0,\n  );\n  return decidiuNaoPertence ? [Evidencia.NAO_PERTENCE] : [];\n}\n\n'''
          patch('src/curriculum/procedimentos/classificacaoProcedure.ts', marker, evidence_fn + marker)

          patch(
              'src/curriculum/fichas/jornada/AL.01.ts',
              'import { MisconceptionTag } from "../../../constants/misconceptions";',
              'import { Evidencia } from "../../../constants/evidencias";\nimport { MisconceptionTag } from "../../../constants/misconceptions";',
          )
          patch(
              'src/curriculum/fichas/jornada/AL.01.ts',
              'const dominio = { acertos: 3, de: 3, sessoes: 2 };',
              '''const dominio = {\n  acertos: 3,\n  de: 3,\n  sessoes: 2,\n  exige: {\n    evidencia: Evidencia.NAO_PERTENCE,\n    descricao: "Deixar corretamente fora pelo menos uma peça que não pertence ao grupo.",\n  },\n};''',
          )

          patch(
              'src/components/gameloop/answerPolicy.ts',
              'import { AcaoDeClassificacao, diagnosticar as diagnosticarClassificacao } from "../../curriculum/procedimentos/classificacaoProcedure";',
              'import { AcaoDeClassificacao, diagnosticar as diagnosticarClassificacao, evidenciasDe as evidenciasDaClassificacao } from "../../curriculum/procedimentos/classificacaoProcedure";',
          )
          patch(
              'src/components/gameloop/answerPolicy.ts',
              '  if (meta.touchcount) achadas.push(...evidenciasDaContagem(meta.touchcount as AcaoDeContagem));',
              '  if (meta.classificacao) achadas.push(...evidenciasDaClassificacao(meta.classificacao as AcaoDeClassificacao));\n  if (meta.touchcount) achadas.push(...evidenciasDaContagem(meta.touchcount as AcaoDeContagem));',
          )

          patch(
              'src/curriculum/evidenciaDaFicha.test.ts',
              'import { evidenciasDe as daContagem } from "./procedimentos/touchCountProcedure";',
              'import { evidenciasDe as daClassificacao } from "./procedimentos/classificacaoProcedure";\nimport { evidenciasDe as daContagem } from "./procedimentos/touchCountProcedure";',
          )
          emitter_anchor = '''const EMISSORES: { nome: string; evidencia: string; emitir: () => string[] }[] = [\n'''
          emitter = '''  {\n    nome: "F51 (classificação) — decisão correta de deixar uma peça fora",\n    evidencia: Evidencia.NAO_PERTENCE,\n    emitir: () => daClassificacao({\n      forma: "um-laco",\n      criterios: [{ atributo: "cor", valor: "vermelho" }],\n      colocacoes: [\n        {\n          peca: { id: 1, cor: "vermelho", forma: "circulo", tamanho: "grande" },\n          onde: [0], tentativas: [],\n        },\n        {\n          peca: { id: 2, cor: "azul", forma: "quadrado", tamanho: "pequeno" },\n          onde: [], tentativas: [],\n        },\n      ],\n    }),\n  },\n'''
          patch('src/curriculum/evidenciaDaFicha.test.ts', emitter_anchor, emitter_anchor + emitter)

          wrong_anchor = '''    expect(daContagem({ marcados: 4, total: 5, toquesRepetidos: 0, resposta: 4, arranjo: "disperso" })).toEqual([]);'''
          wrong = '''    expect(daClassificacao({\n      forma: "um-laco",\n      criterios: [{ atributo: "cor", valor: "vermelho" }],\n      colocacoes: [\n        {\n          peca: { id: 1, cor: "vermelho", forma: "circulo", tamanho: "grande" },\n          onde: [0], tentativas: [],\n        },\n        {\n          peca: { id: 2, cor: "azul", forma: "quadrado", tamanho: "pequeno" },\n          onde: [0], tentativas: [[0]],\n        },\n      ],\n    })).toEqual([]);\n'''
          patch('src/curriculum/evidenciaDaFicha.test.ts', wrong_anchor, wrong + wrong_anchor)
          PY
          git diff --check

      - name: Provar domínio da F51 e regressão geral
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run src/curriculum/evidenciaDaFicha.test.ts src/curriculum/conformidadeDeFichas.test.ts src/components/primitives/ClassificacaoStage.f51.test.tsx
          npm test -- --run
          npm run build

      - name: Publicar correção e remover bancada
        run: |
          rm .github/workflows/fix-al01-evidence.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src .github/workflows/fix-al01-evidence.yml
          git diff --cached --check
          git commit -m 'AL.01: domínio passa a exigir prova real do não pertence'
          git push origin HEAD:codex/integrar-bloco-f0
