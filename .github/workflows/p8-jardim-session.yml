name: P8 - sessao real do Jardim

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  session:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar sessao P8
        run: python AI_Studio_Lab/tools/p8_session_apply.py
      - name: Restaurar bloco de review sem backreference
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('src/components/GameLoop.tsx')
          s = p.read_text()
          if s.count('\x01') != 1:
              raise SystemExit(f'marcador de captura esperado 1x, encontrado {s.count(chr(1))}x')
          original = subprocess.check_output(
              ['git', 'show', 'HEAD:src/components/GameLoop.tsx'], text=True
          )
          pattern = re.compile(
              r'    // AI smart review: mastering a missed question after 2 hits\n(.*?)\n    // ⭐ XP vitalício e Nivelamento por Velocidade \(Dojo\)',
              re.S,
          )
          m = pattern.search(original)
          if not m:
              raise SystemExit('bloco original de review nao localizado')
          p.write_text(s.replace('\x01', m.group(1)))
          PY
      - name: Declarar a porta autoral exclusiva do Jardim
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/curriculum/motores/portaDosFundos.test.ts')
          s = p.read_text()
          old = '''  "src/curriculum/motores/composerCanary.ts":
    "é A ponte: o único caminho de produção da ficha até a tela",
  "src/components/admin/SandboxModal.tsx":'''
          new = '''  "src/curriculum/motores/composerCanary.ts":
    "é A ponte dos nós da Jornada: canário e rollback escolhem a ficha do DAG",
  "src/curriculum/motores/jardimSession.ts":
    "é a ponte deliberada das fichas JD de automaticidade: JD não é nó do DAG " +
    "nem substitui gerador legado, por isso não participa de COMPOSER_CANARIES",
  "src/components/admin/SandboxModal.tsx":'''
          if s.count(old) != 1:
              raise SystemExit(f'ancora PORTAS_LEGITIMAS esperada 1x, encontrada {s.count(old)}x')
          p.write_text(s.replace(old, new))
          PY
      - name: Verificar contratos
        run: |
          git diff --check
          npm run auditar
          npm run fichas:auditar
          npm run grafo:check
          npx tsc --noEmit
      - name: Testes focais P8 e porta dos fundos
        run: |
          npx vitest run src/curriculum/motores/jardimEngine.test.ts src/curriculum/motores/jardimSession.test.ts src/curriculum/fichas/dojo/jardim/jardim.test.ts src/curriculum/motores/portaDosFundos.test.ts
      - name: Suite completa e build
        run: |
          npm test -- --run
          npm run build
      - name: Publicar sessao aprovada e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p8_session_apply.py .github/workflows/p8-jardim-session.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P8: separa sessao do Jardim da progressao da Jornada'
          git push origin HEAD:codex/integrar-bloco-f0
