name: Promote AL01 canary

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  promote:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Promover somente AL.01
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/curriculum/motores/composerCanary.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  // A AL.01 SAIU daqui: a ficha dela foi reescrita de `intruso_math` ("qual é\n  // o diferente?", múltipla escolha) para a F51 de verdade — separar peças em\n  // laços, com o "não pertence" como resposta. É tela nova, e tela nova não\n  // estreia no PR que a escreve. O rollback cai em `legadoAL_01`, que é o\n  // intruso que ela serve hoje.\n'''
          new = '''  // AL.01/F51 — promovida depois do intervalo de observação: cinco níveis\n  // inspecionados em 320/390/900, §9 ligada ponta a ponta à evidência\n  // NAO_PERTENCE e rollback congelado em `legadoAL_01`. A promoção é um único\n  // id e pode ser revertida removendo-o deste conjunto.\n  "AL.01",\n'''
          if old not in s:
              raise SystemExit('bloco histórico AL.01 não encontrado no canário')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Provar o contrato de promoção
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run \
            src/curriculum/motores/canaryContract.test.ts \
            src/curriculum/motores/implementacaoSemAtivacao.test.ts \
            src/curriculum/evidenciaDaFicha.test.ts \
            src/curriculum/procedimentos/classificacaoProcedure.test.ts \
            src/components/primitives/ClassificacaoStage.f51.test.tsx
          npm test -- --run
          npm run build

      - name: Publicar promoção e apagar bancada
        run: |
          rm .github/workflows/promote-al01-canary.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/curriculum/motores/composerCanary.ts .github/workflows/promote-al01-canary.yml
          git diff --cached --check
          git commit -m 'canário AL.01: F51 passa a substituir o intruso legado com rollback explícito'
          git push origin HEAD:codex/integrar-bloco-f0
