name: P19 - remediacao minima de dependencias

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Atualizar somente resolucoes compatíveis do lockfile
        run: npm update js-yaml nanoid postcss body-parser --package-lock-only --ignore-scripts
      - name: Provar instalacao reprodutivel pelo lock novo
        run: |
          rm -rf node_modules
          npm ci
      - name: Exigir audit zerado
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
      - name: Registrar versoes resolvidas
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const names = ['js-yaml','nanoid','postcss','body-parser'];
          const versions = Object.fromEntries(names.map(n => [n, lock.packages?.[`node_modules/${n}`]?.version || '?']));
          const path = 'AI_Studio_Lab/codex/AUDITORIA_P19_DEPENDENCIAS.md';
          let md = fs.readFileSync(path, 'utf8');
          md += '\n\n## Remediação mínima validada\n\n';
          md += 'Nenhuma range declarada em `package.json` precisou mudar. O lockfile foi atualizado dentro das ranges existentes.\n\n';
          for (const [name, version] of Object.entries(versions)) md += `- \`${name}\` → \`${version}\`;\n`;
          md += '\nApós reinstalação limpa com `npm ci`, `npm audit --audit-level=low` e `npm audit --omit=dev --audit-level=low` retornaram zero vulnerabilidades. A mesma árvore atravessou TypeScript, suíte completa e build antes da publicação.\n';
          fs.writeFileSync(path, md);
          NODE
      - name: Gates do SAGA
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run grafo:check
          npx tsc --noEmit
          npm test -- --run
          npm run build
          git diff --check
      - name: Publicar lock seguro e limpar workflow
        run: |
          rm .github/workflows/p19-dependency-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json AI_Studio_Lab/codex/AUDITORIA_P19_DEPENDENCIAS.md .github/workflows/p19-dependency-remediation.yml
          git commit -m 'P19: atualiza lockfile para dependencias corrigidas'
          git push origin HEAD:codex/integrar-bloco-f0
