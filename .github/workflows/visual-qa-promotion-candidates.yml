name: Visual QA promotion candidates

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  capture:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar Chromium compatível
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Capturar candidatos ainda desligados
        run: |
          rm -rf /tmp/promotion-qa
          for largura in 320 390 900; do
            for filtro in 'AL.01' 'N1.06' 'N1.13' 'N1.09 micro-aula' 'GE.01' 'GE.02' 'GM.01'; do
              PRINTS_LARGURA="$largura" \
              PRINTS_OUT="/tmp/promotion-qa/$largura" \
              node scripts/prints.mjs "$filtro"
            done
          done
          find /tmp/promotion-qa -type f -name '*.png' | sort

      - name: Publicar artefato para inspeção humana
        uses: actions/upload-artifact@v4
        with:
          name: promotion-candidates-visual-qa
          path: /tmp/promotion-qa
          if-no-files-found: error
          retention-days: 7

      - name: Apagar bancada do repositório
        run: |
          rm .github/workflows/visual-qa-promotion-candidates.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add .github/workflows/visual-qa-promotion-candidates.yml
          git commit -m 'higiene: remove bancada visual dos candidatos de promoção'
          git push origin HEAD:codex/integrar-bloco-f0
