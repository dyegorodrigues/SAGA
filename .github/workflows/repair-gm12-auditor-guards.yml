name: Repair GM12 auditor guards

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  repair:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Corrigir guardas atrasadas da P15
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/curriculum/conformidadeDeFichas.test.ts')
          s = p.read_text(encoding='utf-8')
          old = 'export const PRIMITIVAS_PENDENTES = ["Moedas", "Regua"];'
          new = 'export const PRIMITIVAS_PENDENTES = ["Moedas", "Recipientes", "Regua"];'
          if old not in s:
              raise SystemExit('assinatura antiga de PRIMITIVAS_PENDENTES não encontrada')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/curriculum/fichaRuntimeMap.test.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'mantém as 25 primitivas declaradas explicitamente mapeadas': 'mantém as 26 primitivas declaradas explicitamente mapeadas',
              'Primitivas declaradas: 25': 'Primitivas declaradas: 26',
              'expect(output).toContain("Regua: ausente");': 'expect(output).toContain("Recipientes: ausente");\n    expect(output).toContain("Regua: ausente");',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'assinatura antiga não encontrada: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Portões da retificação
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run src/curriculum/fichaRuntimeMap.test.ts src/curriculum/conformidadeDeFichas.test.ts
          npm test -- --run
          npm run build

      - name: Publicar e apagar executor
        run: |
          rm .github/workflows/repair-gm12-auditor-guards.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/curriculum/conformidadeDeFichas.test.ts src/curriculum/fichaRuntimeMap.test.ts .github/workflows/repair-gm12-auditor-guards.yml
          git diff --cached --check
          git commit -m 'auditoria: registra Recipientes como divida explicita'
          git push origin HEAD:codex/integrar-bloco-f0
