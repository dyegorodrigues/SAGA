name: QA GM12 verification state

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  capture:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Capturar depois do despejo
        run: |
          rm -rf /tmp/gm12-verificado
          for largura in 320 390 900; do
            for nivel in 2 3; do
              PRINTS_LARGURA="$largura" \
              PRINTS_OUT="/tmp/gm12-verificado/$largura" \
              PRINTS_CLICK='[data-recipientes-verify]' \
              PRINTS_SUFFIX='_verificado' \
              PRINTS_CLICK_WAIT_MS=1300 \
              node scripts/prints.mjs "GM.12 F50 massa/capacidade (nível $nivel)"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gm12-verification-state
          path: /tmp/gm12-verificado
          if-no-files-found: error
          retention-days: 7
      - name: Apagar bancada
        run: |
          rm .github/workflows/qa-gm12-verification.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add .github/workflows/qa-gm12-verification.yml
          git commit -m 'higiene: remove bancada de verificacao visual da GM.12'
          git push origin HEAD:codex/integrar-bloco-f0
