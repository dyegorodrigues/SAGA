name: F28 - microtexto pt-BR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corrigir frase
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/curriculum/Composer.ts')
          s = p.read_text()
          old = 'promptOverride = `${parte} mais quanto da dez?`;'
          new = 'promptOverride = `${parte} mais quanto dá dez?`;'
          if s.count(old) != 1:
              raise SystemExit(f'frase esperada 1x, encontrada {s.count(old)}x')
          p.write_text(s.replace(old, new))
          PY
      - name: Teste focal e TypeScript
        run: |
          npx tsc --noEmit
          npx vitest run src/curriculum/fichas/jornada/parteTodoProgressao.test.ts
      - name: Suite e build
        run: |
          npm test -- --run
          npm run build
      - name: Publicar e limpar bancada
        run: |
          rm .github/workflows/fix-n111-texto.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'F28: corrige fala de complemento ate dez'
          git push origin HEAD:codex/integrar-bloco-f0
