name: P19 - migrador unico de estado

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar migrador unico
        run: python AI_Studio_Lab/tools/p19_migrator_apply.py
      - name: Contratos e testes focais
        run: |
          git diff --check
          npx tsc --noEmit
          npx vitest run src/utils/migrator.test.ts src/curriculum/motores/progressEngine.test.ts src/curriculum/motores/jardimSession.test.ts
      - name: Suite completa e build
        run: |
          npm test -- --run
          npm run build
      - name: Publicar e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p19_migrator_apply.py .github/workflows/p19-state-migrator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P19: unifica migracao de estado fora do App'
          git push origin HEAD:codex/integrar-bloco-f0
