name: Implement F50 GM12 v4

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  implement:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Reconstituir F50 validada e corrigir a sonda
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const source = YAML.parse(fs.readFileSync('.github/workflows/impl-gm12-f50-v3.yml', 'utf8'));
          const step = source.jobs.implement.steps.find(s => s.name === 'Reconstituir F50 e completar contratos');
          if (!step?.run) throw new Error('etapa de reconstrução v3 não encontrada');
          fs.writeFileSync('/tmp/f50-rebuild.sh', step.run, { mode: 0o700 });
          NODE
          bash /tmp/f50-rebuild.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sonda-layout.mjs')
          s = p.read_text(encoding='utf-8')
          old = '''const CHROME = process.env.SONDA_CHROME\n  || "/opt/pw-browsers/chromium-1194/chrome-linux/chrome";'''
          new = '''// O Playwright conhece a revisão compatível com a própria versão. Congelar\n// `/opt/.../chromium-1194` fez a sonda quebrar quando playwright-core evoluiu.\nconst CHROME = process.env.SONDA_CHROME || chromium.executablePath();'''
          if old not in s:
              raise SystemExit('caminho congelado da sonda não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Instalar Chromium compatível
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Provar F50 ponta a ponta
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npx vitest run src/curriculum/procedimentos/medidasProcedure.test.ts src/curriculum/procedimentos/medidasContract.test.ts src/curriculum/evidenciaDaFicha.test.ts src/curriculum/conformidadeDeFichas.test.ts src/curriculum/fichaRuntimeMap.test.ts
          npm test -- --run
          npm run sonda -- "GM.12"
          npm run build

      - name: Publicar implementação e limpar bancadas
        run: |
          rm -f .github/workflows/impl-gm12-f50-v3.yml .github/workflows/impl-gm12-f50-v4.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src scripts/sonda-layout.mjs AI_Studio_Lab/tools/ficha_runtime_map.cjs sonda/cenas.tsx .github/workflows/impl-gm12-f50-v3.yml .github/workflows/impl-gm12-f50-v4.yml
          git diff --cached --check
          git commit -m 'GM.12 pela F50: massa e capacidade sem deixar a aparência responder'
          git push origin HEAD:codex/integrar-bloco-f0
