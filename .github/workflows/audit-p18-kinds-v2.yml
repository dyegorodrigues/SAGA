name: Audit P18 kinds v2

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  audit:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Auditar declarações reais via AST
        run: |
          cat > /tmp/p18-audit.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const debt = [
            'linking-cubes', 'missing-addend-frame', 'multiple_choice',
            'sentencebuilder', 'sequence', 'singaporebars', 'subvis',
            'take-apart', 'visual-addition',
          ];
          const canonicalAlias = {
            'linking-cubes': ['LinkingCubes'],
            'missing-addend-frame': ['MissingAddendFrame', 'missing-addend-frame'],
            'multiple_choice': ['multiple_choice'],
            'sentencebuilder': ['SentenceBuilder'],
            'sequence': ['Sequence', 'sequence'],
            'singaporebars': ['SingaporeBars'],
            'subvis': ['subvis'],
            'take-apart': ['TakeApart', 'take-apart'],
            'visual-addition': ['VisualAddition', 'visual-addition'],
          };

          function walk(dir, predicate) {
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(p, predicate));
              else if (predicate(p)) out.push(p);
            }
            return out;
          }

          const fichaFiles = walk('src/curriculum/fichas', p => p.endsWith('.ts') && !p.includes('.test.'));
          const declarations = new Map(debt.map(k => [k, []]));

          for (const file of fichaFiles) {
            const text = fs.readFileSync(file, 'utf8');
            const sf = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            function visit(node) {
              if (ts.isPropertyAssignment(node)) {
                const name = node.name.getText(sf).replace(/["']/g, '');
                if (name === 'primitiva' && ts.isStringLiteralLike(node.initializer)) {
                  const v = node.initializer.text;
                  if (declarations.has(v)) declarations.get(v).push(`${file}:${sf.getLineAndCharacterOfPosition(node.getStart()).line + 1}: primitiva`);
                }
                if (name === 'kinds' && ts.isArrayLiteralExpression(node.initializer)) {
                  for (const el of node.initializer.elements) {
                    if (ts.isStringLiteralLike(el) && declarations.has(el.text)) {
                      declarations.get(el.text).push(`${file}:${sf.getLineAndCharacterOfPosition(el.getStart()).line + 1}: kinds`);
                    }
                  }
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(sf);
          }

          const canonFiles = walk('AI_Studio_Lab/pedagogia/fichas', p => p.endsWith('.md'));
          const canonical = new Map(debt.map(k => [k, []]));
          for (const file of canonFiles) {
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            lines.forEach((line, i) => {
              if (!/\*\*Primitiva:\*\*/i.test(line)) return;
              for (const kind of debt) {
                if (canonicalAlias[kind].some(a => line.toLowerCase().includes(a.toLowerCase()))) {
                  canonical.get(kind).push(`${file}:${i + 1}: ${line.trim()}`);
                }
              }
            });
          }

          const composer = fs.readFileSync('src/curriculum/Composer.ts', 'utf8');
          const schema = fs.readFileSync('src/curriculum/schema.ts', 'utf8');
          const renderers = [
            'src/components/FichaRenderer.tsx',
            'src/components/gameloop/GameLoopExerciseRenderer.tsx',
          ].map(f => [f, fs.readFileSync(f, 'utf8')]);
          const allSrc = walk('src', p => /\.(ts|tsx)$/.test(p));

          function countLiteralKind(kind) {
            const rx = new RegExp(`kind\\s*:\\s*["']${kind.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}["']`, 'g');
            const hits = [];
            for (const file of allSrc) {
              if (file === 'src/curriculum/schema.ts' || file.endsWith('kindComBuilder.test.ts')) continue;
              const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
              lines.forEach((line, i) => { if (rx.test(line)) hits.push(`${file}:${i + 1}: ${line.trim()}`); rx.lastIndex = 0; });
            }
            return hits;
          }

          const rows = [];
          const details = [];
          for (const kind of debt) {
            const decl = declarations.get(kind);
            const canon = canonical.get(kind);
            const builder = new RegExp(`case\\s+["']${kind.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}["']\\s*:`).test(composer);
            const rendererHits = renderers.flatMap(([file, text]) => text.toLowerCase().includes(kind.toLowerCase()) ? [file] : []);
            const generated = countLiteralKind(kind);
            const inKindType = new RegExp(`["']${kind.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}["']`).test(schema.split(';', 1)[0]);

            let verdict;
            if (decl.length) verdict = 'DÍVIDA REAL ATUAL — ficha TS declara; não remover sem migrar a ficha';
            else if (canon.length) verdict = 'DÍVIDA CANÔNICA FUTURA — não há ficha TS atual; retirar do tipo até existir contrato executável';
            else if (generated.length || rendererHits.length) verdict = 'LEGADO — Question pode usar, mas não pertence ao KindType autoral sem ficha';
            else verdict = 'ÓRFÃO/RESÍDUO — retirar do KindType autoral';

            rows.push({ kind, decl: decl.length, canon: canon.length, builder, renderer: rendererHits.length, generated: generated.length, inKindType, verdict });
            details.push({ kind, decl, canon, generated, rendererHits });
          }

          const out = [
            '# Auditoria P18 v2 — declarações reais de KindType', '',
            '> Esta versão substitui a contagem textual da v1. Fichas TS são lidas pelo AST:',
            '> somente propriedades reais `primitiva:` e `kinds:` contam. Comentários não contam.', '',
            '## Resultado', '',
            '| kind | ficha TS real | cânone `Primitiva` | builder | renderer legado | gerador literal | decisão |',
            '|---|---:|---:|---|---:|---:|---|',
          ];
          for (const r of rows) out.push(`| \`${r.kind}\` | ${r.decl} | ${r.canon} | ${r.builder ? 'sim' : 'não'} | ${r.renderer} | ${r.generated} | ${r.verdict} |`);

          out.push('', '## Evidências por kind');
          for (const d of details) {
            out.push('', `### \`${d.kind}\``, '');
            out.push(`- ficha TS real: ${d.decl.length ? d.decl.join('; ') : 'nenhuma'}`);
            out.push(`- cânone: ${d.canon.length ? d.canon.join('; ') : 'nenhum'}`);
            out.push(`- gerador que emite \`Question.kind\`: ${d.generated.length ? d.generated.join('; ') : 'nenhum'}`);
            out.push(`- renderer legado: ${d.rendererHits.length ? d.rendererHits.join(', ') : 'nenhum'}`);
          }

          out.push('', '## Decisão arquitetural', '',
            'O `KindType` tipa **fichas autorais**, enquanto `Question.kind` é string e continua livre para o legado.',
            'Logo, remover um kind sem ficha TS do `KindType` **não remove o renderer legado** nem quebra saves:',
            'só impede que uma nova ficha autoral compile prometendo um caminho que o Composer não entrega.', '',
            'A dívida futura deve voltar ao `KindType` no mesmo lote que introduzir contrato, builder, renderer e teste de ficha.'
          );

          fs.writeFileSync('AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md', out.join('\n') + '\n');
          NODE
          node /tmp/p18-audit.mjs
          git diff --check
          cat AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md

      - name: Provar contrato atual
        run: |
          npx vitest run src/curriculum/kindComBuilder.test.ts
          npm run fichas:auditar

      - name: Publicar v2 e remover bancada
        run: |
          rm .github/workflows/audit-p18-kinds-v2.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add AI_Studio_Lab/codex/AUDITORIA_P18_KINDS.md .github/workflows/audit-p18-kinds-v2.yml
          git diff --cached --check
          git commit -m 'P18: separa declarações autorais reais de comentários e legado'
          git push origin HEAD:codex/integrar-bloco-f0
