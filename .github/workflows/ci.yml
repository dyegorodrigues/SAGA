    { id: "d", fonte: "JD4", alvo: "identificar o antecessor até 10 sem depender da reta", kinds: ["plain"], params: { modo: "antecessor", start: 1, end: 10, audio_prompt: "Qual número vem antes?" }, dominio: { acertos: 3, de: 3, sessoes: 2 } },
