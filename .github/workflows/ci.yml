name: Reconcile F05 into F0 integration

on:
  push:
    branches: [codex/reconciliar-f05-f04]

permissions:
  contents: write

concurrency:
  group: reconcile-f05-f04
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reconciliar-f05-f04
          fetch-depth: 0
      - name: Buscar fonte e copiar arquivos F05 não conflitantes
        run: |
          git fetch origin codex/corrigir-n106 codex/integrar-bloco-f0 --depth=100
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout cc2469ec3c650a6ef9c466781645ec63c17dbc22 -- \
            AI_Studio_Lab/codex/RETOMADA.md \
            sonda/cenas.tsx \
            src/components/gameloop/GameLoopExerciseRenderer.tsx \
            src/components/gameloop/answerPolicy.f05.test.ts \
            src/components/gameloop/answerPolicy.ts \
            src/components/gameloop/enunciadoUnico.test.ts \
            src/components/primitives/AudioChoice.tsx \
            src/components/primitives/AudioChoiceStage.f05.test.tsx \
            src/components/primitives/AudioChoiceStage.tsx \
            src/curriculum/Composer.ts \
            src/curriculum/procedimentos/audioChoiceRuntime.test.ts \
            src/curriculum/procedimentos/audioChoiceRuntime.ts
          # GameLoop parte da versão F05; questionDiagnostics permanece o superset F04.
          git checkout cc2469ec3c650a6ef9c466781645ec63c17dbc22 -- src/components/GameLoop.tsx
      - name: Reconciliar políticas e GameLoop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: esperado 1, achei {n}: {old[:90]!r}')
              p.write_text(s.replace(old, new))

          rep('src/components/GameLoop.tsx', '''import {
  evidenciasDaResposta,
  isMotorSlip,
  isRetryableAnswer,
  misconceptionForAnswer,
  ownsAuthorialFeedback,
  ownsAuthorialRetry,
} from "./gameloop/answerPolicy";
import {
  createQuestionDiagnostics,
  recordQuestionAttempt,
  summarizeQuestionDiagnostics,
} from "./gameloop/questionDiagnostics";''', '''import { evidenciasDaResposta, isMotorSlip, isRetryableAnswer, misconceptionForAnswer } from "./gameloop/answerPolicy";
import { ownsAuthorialFeedback, ownsAuthorialRetry } from "./gameloop/authorialStagePolicy";
import { AcaoDeProducao, dependeDeAndaime } from "../curriculum/procedimentos/producaoProcedure";
import { MisconceptionTag } from "../constants/misconceptions";
import {
  createQuestionDiagnostics,
  recordQuestionAttempt,
  recordQuestionHypothesis,
  summarizeQuestionDiagnostics,
} from "./gameloop/questionDiagnostics";''')

          rep('src/components/GameLoop.tsx', '  const questionDiagnosticsRef = useRef(createQuestionDiagnostics());\n', '  const questionDiagnosticsRef = useRef(createQuestionDiagnostics());\n  // F04: histórico apenas da missão. Não vira campo persistente no save.\n  const producaoHistoricoRef = useRef<AcaoDeProducao[]>([]);\n')

          rep('src/components/GameLoop.tsx', '''  useEffect(() => {
    applyTheme(kid.theme);
    pickVoice();
  }, [kid.theme]);

  // reset do sequenciamento''', '''  useEffect(() => {
    applyTheme(kid.theme);
    pickVoice();
  }, [kid.theme]);

  useEffect(() => {
    producaoHistoricoRef.current = [];
  }, [track.id]);

  // reset do sequenciamento''')

          rep('src/components/GameLoop.tsx', '''    const attemptMisconception = misconceptionForAnswer(q, val, answerMeta);
    recordQuestionAttempt(questionDiagnosticsRef.current, right, attemptMisconception);
    const feedbackAutoral = ownsAuthorialFeedback(q, answerMeta);

    // Palco autoral: registra a tentativa no Radar, mas mantém o ciclo de erro''', '''    const attemptMisconception = misconceptionForAnswer(q, val, answerMeta);
    recordQuestionAttempt(questionDiagnosticsRef.current, right, attemptMisconception);
    const feedbackAutoral = ownsAuthorialFeedback(q, answerMeta);

    // F04 §6: DEPENDE_DE_ANDAIME é comparação ENTRE questões. Os warmups
    // fornecem observação com vagas antes do degrau sem andaime.
    if (answerMeta?.touchplace) {
      const acao = answerMeta.touchplace as AcaoDeProducao;
      producaoHistoricoRef.current.push(acao);
      if (dependeDeAndaime(producaoHistoricoRef.current)) {
        recordQuestionHypothesis(questionDiagnosticsRef.current, MisconceptionTag.DEPENDE_DE_ANDAIME);
      }
    }

    // Palco autoral: registra a tentativa no Radar, mas mantém o ciclo de erro''')

          rep('src/components/GameLoop.tsx', '''      // F05 §4 fecha a associação som-símbolo em 1,5s; os demais mantêm a
      // janela de segurança histórica de 10s.
      const espera = feedbackAutoral ? 1500 : 10000;''', '''      // Cada palco autoral fecha no tempo da própria ficha: F05 mantém a
      // associação som-símbolo por 1,5s; F04 já falou/fechou antes da resposta.
      const espera = q.kind === "audiochoice" ? 1500 : feedbackAutoral ? 400 : 10000;''')

          Path('src/components/gameloop/authorialStagePolicy.ts').write_text('''import { AnswerMeta, Question } from "../../types";

/** Palcos que possuem o próprio feedback e retry; GameLoop fica com progresso/Radar. */
export function ownsAuthorialRetry(q: Question, meta?: AnswerMeta): boolean {
  return (q.kind === "touchplace" && meta?.touchplace !== undefined)
    || (q.kind === "audiochoice" && meta?.audiochoice !== undefined);
}

export function ownsAuthorialFeedback(q: Question, meta?: AnswerMeta): boolean {
  return (q.kind === "touchplace" && meta?.touchplace !== undefined)
    || (q.kind === "audiochoice" && meta?.audiochoice !== undefined);
}
''')
          Path('src/components/gameloop/authorialStagePolicy.test.ts').write_text('''import { describe, expect, it } from "vitest";
import { Question } from "../../types";
import { ownsAuthorialFeedback, ownsAuthorialRetry } from "./authorialStagePolicy";

const touch: Question = { kind: "touchplace", prompt: "", answer: 3, uiProps: {} };
const audio: Question = { kind: "audiochoice", prompt: "", answer: 3, uiProps: {} };

describe("autoria de feedback/retry", () => {
  it("F04/TouchPlace é autoral quando publica leitura", () => {
    const meta = { touchplace: { colocados: 2, alvo: 3, bandeja: 5, recusas: 0, comAndaime: false } };
    expect(ownsAuthorialRetry(touch, meta)).toBe(true);
    expect(ownsAuthorialFeedback(touch, meta)).toBe(true);
  });
  it("F05/AudioChoice é autoral quando publica leitura", () => {
    const meta = { audiochoice: { alvo: 3, alternativas: [2,3,4], resposta: 2, repeticoes: 0, tentativa: 1, primeiraAudicaoConcluida: true } };
    expect(ownsAuthorialRetry(audio, meta)).toBe(true);
    expect(ownsAuthorialFeedback(audio, meta)).toBe(true);
  });
  it("kind sem meta não sequestra feedback", () => {
    expect(ownsAuthorialRetry(touch)).toBe(false);
    expect(ownsAuthorialFeedback(audio)).toBe(false);
  });
});
''')

          p = Path('src/components/gameloop/answerPolicy.ts')
          s = p.read_text()
          old = '''/**
 * F05 §4: o próprio palco possui o ciclo erro → repetir som → tentar de novo.
 * O GameLoop só registra a tentativa; não acrescenta "Ops", não esconde opção
 * e não transforma a terceira tentativa em erro terminal.
 */
export function ownsAuthorialRetry(q: Question, meta?: AnswerMeta): boolean {
  return q.kind === "audiochoice" && meta?.audiochoice !== undefined;
}

/** F05 também possui voz/fecho autorais; o GameLoop não fala por cima. */
export function ownsAuthorialFeedback(q: Question, meta?: AnswerMeta): boolean {
  return q.kind === "audiochoice" && meta?.audiochoice !== undefined;
}

'''
          if s.count(old) != 1:
              raise SystemExit(f'answerPolicy bloco autoral: {s.count(old)}')
          p.write_text(s.replace(old, ''))

          rep('src/components/gameloop/answerPolicy.f05.test.ts', '''import {
  evidenciasDaResposta,
  misconceptionForAnswer,
  ownsAuthorialFeedback,
  ownsAuthorialRetry,
} from "./answerPolicy";''', '''import { evidenciasDaResposta, misconceptionForAnswer } from "./answerPolicy";
import { ownsAuthorialFeedback, ownsAuthorialRetry } from "./authorialStagePolicy";''')
          PY
          git diff --check
      - name: Publicar reconciliação e restaurar CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: reconcilia checkpoint F05 com F04 e AL.01'
          git show origin/codex/integrar-bloco-f0:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git commit -m 'chore: restaura CI da branch auxiliar'
          git push origin HEAD:codex/reconciliar-f05-f04
