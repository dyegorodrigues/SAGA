        run: |
          git reset --hard "$START_SHA"
          git show "$START_SHA^:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git config user.name "saga-ci-bot"
          git config user.email "saga-ci-bot@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "chore: restaura CI apos falha P22.3A" || true
