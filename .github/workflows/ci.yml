name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fechar-f04:
    name: Limpar bancada F04
    if: github.head_ref == 'codex/corrigir-n113' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n113
          fetch-depth: 0
      - name: Remover smokes redundantes e restaurar CI
        run: |
          rm -f \
            src/components/gameloop/f04-no-generic-third-error.test.ts \
            src/components/gameloop/f04-policy-smoke.test.ts \
            src/components/primitives/TouchPlaceStage.reset-contract.test.tsx \
            src/curriculum/procedimentos/f04-no-timer-contract.test.ts \
            src/curriculum/procedimentos/producao-history-contract.test.ts
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
      - name: Commitar fechamento da branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: limpa bancada e fecha correção F04'
          git push origin HEAD:codex/corrigir-n113
