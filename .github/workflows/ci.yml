name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-f47:
    name: Fechar inspeção humana F47
    if: github.event.action == 'reopened' && github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corrigir clipping do drop e destaque dos beats 2/3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/primitives/CenaDePosicaoStage.tsx')
          s=p.read_text()
          old='''const LIMIAR_ARRASTO = 8;\nconst LADO_GHOST = 64;'''
          new='''const LIMIAR_ARRASTO = 8;\nconst LADO_GHOST = 64;\n// O sprite colocado mede 52px. Metade são 26px; mais 4px de folga preservam\n// o personagem inteiro também contra a borda visual do ShapeCanvas.\nconst RAIO_OBJETO_POSTO = 30;'''
          if s.count(old)!=1: raise SystemExit('constantes F47 mudaram')
          s=s.replace(old,new)

          old='''  function soltarNoPonto(ponto: Ponto | null) {\n    setNaMao(false);\n    setDrag(null);\n    dragRef.current = null;\n    if (!ponto || travado || !spec.produz) return;\n    setPosto(ponto);\n    responder(posicaoDoPonto(spec, ponto));\n  }'''
          new='''  function confinarPonto(ponto: Ponto): Ponto {\n    return {\n      x: Math.min(LARGURA_DA_CENA - RAIO_OBJETO_POSTO, Math.max(RAIO_OBJETO_POSTO, ponto.x)),\n      y: Math.min(ALTURA_DA_CENA - RAIO_OBJETO_POSTO, Math.max(RAIO_OBJETO_POSTO, ponto.y)),\n    };\n  }\n\n  function soltarNoPonto(ponto: Ponto | null) {\n    setNaMao(false);\n    setDrag(null);\n    dragRef.current = null;\n    if (!ponto || travado || !spec.produz) return;\n    const contido = confinarPonto(ponto);\n    setPosto(contido);\n    responder(posicaoDoPonto(spec, contido));\n  }'''
          if s.count(old)!=1: raise SystemExit('soltarNoPonto mudou')
          s=s.replace(old,new)

          old='''          background: "transparent",\n          border: "none",\n          padding: 0,\n          fontSize: o.tamanho,\n          lineHeight: 1,\n          zIndex: 4,'''
          new='''          background: emFoco ? "rgba(37, 99, 235, 0.12)" : "transparent",\n          border: emFoco ? "3px solid #2563EB" : "3px solid transparent",\n          borderRadius: "50%",\n          boxShadow: emFoco ? "0 0 0 5px rgba(37, 99, 235, 0.10)" : "none",\n          padding: 0,\n          fontSize: o.tamanho,\n          lineHeight: 1,\n          zIndex: 4,'''
          if s.count(old)!=1: raise SystemExit('estilo do objeto F47 mudou')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Regressões focadas
        run: |
          npm run lint
          npx vitest run src/components/primitives/CenaDePosicaoStage.test.tsx src/components/primitives/CenaDePosicaoStage.f47.test.tsx src/components/gameloop/posicaoAuthorialPolicy.test.tsx src/components/gameloop/answerPolicy.test.ts
      - name: Acrescentar beats da microaula só na bancada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sonda/cenas.tsx'); s=p.read_text()
          anchor='''  {\n    nome: "GE.01 micro-aula: esta é a mesa",\n    render: (s: number) => (\n      <ExercicioDaFicha ficha={GE_01} lvl={1} semente={s} mostrar={{ destacarReferencial: true }} />\n    ),\n  },'''
          extra=anchor+'''\n  {\n    nome: "GE.01 micro-aula: objeto em cima",\n    render: (s: number) => <ExercicioDaFicha ficha={GE_01} lvl={1} semente={s} mostrar={{ destacarObjeto: 0 }} />,\n  },\n  {\n    nome: "GE.01 micro-aula: objeto embaixo",\n    render: (s: number) => <ExercicioDaFicha ficha={GE_01} lvl={1} semente={s} mostrar={{ destacarObjeto: 1 }} />,\n  },'''
          if s.count(anchor)!=1: raise SystemExit('cenas GE.01 mudaram')
          p.write_text(s.replace(anchor,extra))
          PY
      - name: Preparar Chromium
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            sudo mkdir -p /opt/pw-browsers
            sudo chown -R "$USER":"$USER" /opt/pw-browsers
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          test -n "$CHROME_REAL"
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Portão GE.01 com 8 sementes após a correção visual
        env:
          SONDA_SEMENTES: '8'
        run: npm run sonda -- "GE.01"
      - name: Prints e estados que reprovaram na inspeção humana
        run: |
          mkdir -p /tmp/ge01-closure/prints /tmp/ge01-closure/states
          PRINTS_OUT=/tmp/ge01-closure/prints PRINTS_LARGURA=390 node scripts/prints.mjs "GE.01"
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process'; import {chromium} from 'playwright-core';
          const porta=5199; const vite=spawn('npx',['vite','--port',String(porta),'--strictPort'],{stdio:['ignore','pipe','pipe'],detached:true});
          await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('vite')),60000); vite.stdout.on('data',d=>{if(String(d).includes('ready in')){clearTimeout(t);ok();}})});
          const b=await chromium.launch({executablePath:'/opt/pw-browsers/chromium-1194/chrome-linux/chrome',args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:390,height:700},deviceScaleFactor:2}); await p.goto(`http://localhost:${porta}/sonda/?sementes=1`,{waitUntil:'networkidle'}); await p.waitForFunction(()=>window.sonda?.total>0);
          const nomes=await p.evaluate(()=>window.sonda.nomes()); const idx=t=>{const i=nomes.findIndex(n=>n.includes(t));if(i<0)throw Error(t);return i}; const ir=async t=>{await p.evaluate(i=>window.sonda.ir(i),idx(t));await p.waitForTimeout(650)};
          const campo=()=>p.locator('div.relative.overflow-hidden.select-none.rounded-2xl').first();
          await ir('GE.01 onde está (nível 5)'); let tray=p.getByRole('button',{name:'Pegar o objeto'}); let tb=await tray.boundingBox(); let f=await campo().boundingBox(); if(!tb||!f)throw Error('geo'); const body=(await p.locator('body').innerText()).toLowerCase(); const ped=body.includes('embaixo')?'embaixo':'em cima';
          const drag=async y=>{tb=await p.getByRole('button',{name:'Pegar o objeto'}).boundingBox(); f=await campo().boundingBox(); if(!tb||!f)throw Error('geo2'); await p.mouse.move(tb.x+tb.width/2,tb.y+tb.height/2);await p.mouse.down();await p.mouse.move(f.x+f.width/2,y,{steps:10});await p.mouse.up();};
          const wrongY=ped==='em cima'?f.y+f.height-2:f.y+2; await drag(wrongY); await p.waitForTimeout(220); await p.screenshot({path:'/tmp/ge01-closure/states/01_DROP_ERRADO_CONTIDO.png'}); const placedWrong=p.locator('[aria-label^="Objeto colocado "]'); if(await placedWrong.count()!=1)throw Error('sem objeto errado'); const wb=await placedWrong.boundingBox(); f=await campo().boundingBox(); if(!wb||!f||wb.y<f.y-1||wb.y+wb.height>f.y+f.height+1)throw Error('objeto errado cortado');
          await p.waitForTimeout(2000); f=await campo().boundingBox(); if(!f)throw Error('geo3'); const rightY=ped==='em cima'?f.y+2:f.y+f.height-2; await drag(rightY); await p.waitForTimeout(260); await p.screenshot({path:'/tmp/ge01-closure/states/02_DROP_CORRETO_CONTIDO.png'}); const placed=p.locator('[aria-label^="Objeto colocado "]'); const pb=await placed.boundingBox(); f=await campo().boundingBox(); if(!pb||!f||pb.y<f.y-1||pb.y+pb.height>f.y+f.height+1)throw Error('objeto correto cortado');
          for(const [t,n] of [['GE.01 micro-aula: objeto em cima','03_MICRO_OBJETO_0_HALO'],['GE.01 micro-aula: objeto embaixo','04_MICRO_OBJETO_1_HALO']]){await ir(t); await p.screenshot({path:`/tmp/ge01-closure/states/${n}.png`}); if(await p.locator('button[style*="rgb(37, 99, 235)"]').count()<1) throw Error('halo não visível');}
          await b.close(); try{process.kill(-vite.pid,'SIGKILL')}catch{vite.kill('SIGKILL')}
          NODE
      - name: Folha de contato
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          fs=sorted(Path('/tmp/ge01-closure/prints').glob('*.png'))+sorted(Path('/tmp/ge01-closure/states').glob('*.png')); tw,th,lab,cols=195,350,30,2; rows=max(1,(len(fs)+1)//2); out=Image.new('RGB',(cols*tw,rows*(th+lab)),'white');d=ImageDraw.Draw(out)
          for i,x in enumerate(fs):
            im=Image.open(x).convert('RGB');im.thumbnail((tw,th));px=(i%2)*tw;py=(i//2)*(th+lab);out.paste(im,(px+(tw-im.width)//2,py+(th-im.height)//2));d.text((px+2,py+th+2),x.stem[:42],fill='black')
          out.save('/tmp/ge01-closure/contact-sheet.jpg',quality=86)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge01-closure
          path: /tmp/ge01-closure
          retention-days: 7
      - name: Restaurar CI original e publicar correção
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/components/primitives/CenaDePosicaoStage.tsx .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'GE.01/F47: mantém produção inteira e tutorial legível nas bordas'
          git push origin HEAD:codex/integrar-bloco-f0
