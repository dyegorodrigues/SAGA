name: CI

# Roda os mesmos gates que o protocolo do projeto já exige antes de publicar.
# A intenção é que "checks verdes" deixe de depender de alguém lembrar de rodar
# tudo localmente e passe a ser condição verificável no PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # pr:check compara o head real com a base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Buscar a base do PR
        run: git fetch origin main --depth=1

      - name: Instalar dependências
        run: npm ci

      # Invariantes curriculares: contagem canônica, IDs rejeitados, geradores
      # órfãos e deriva de nomenclatura.
      - name: Auditoria do catálogo
        run: npm run auditar

      - name: Auditoria das fichas
        run: npm run fichas:auditar

      - name: Conformidade das fichas
        run: npm run fichas:conferir

      # O grafo é artefato derivado; o modo --check falha se alguém editar o
      # gerado sem regerar a partir do YAML canônico.
      - name: Sincronia do grafo
        run: npm run grafo:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Guarda textual do PR
        env:
          PR_BASE: origin/main
        run: npm run pr:check

  sonda-sensei-dojo:
    name: Sonda real Sensei ↔ Dojo
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Resolver Chrome do runner
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium não encontrado no runner." >&2
            exit 1
          fi
          echo "SONDA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Sonda real do card e do round prescrito
        run: npm run sonda:sensei-dojo

      - name: Evidências da sonda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-sensei-dojo-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-sensei-dojo/
          if-no-files-found: warn
          retention-days: 14

  higiene-diff:
    name: Higiene do diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1

      # Markdown usa dois espaços no fim da linha como hard break semântico.
      # O `git diff --check` puro confunde essa sintaxe válida com sujeira e,
      # nesta branch documental longa, produzia falso vermelho. Mantemos o
      # portão integral para código/config/dados e deixamos a coerência dos docs
      # sob os auditores canônicos específicos do SAGA.
      - name: Verificar whitespace do diff
        run: >-
          git diff --check origin/${{ github.base_ref }}...HEAD -- .
          ':(exclude)**/*.md' ':(exclude)*.md'

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # Por padrão o Actions confere um merge commit sintético do PR, o que
          # distorceria o diff. Aqui o alvo é o head real da branch.
          ref: ${{ github.event.pull_request.head.sha }}
          # A guarda compara com a base do PR; precisa do histórico.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1

      # O criador de PR deste ambiente não aceita binários no diff textual.
      # Falhar aqui é mais barato que descobrir na hora de publicar.
      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs
