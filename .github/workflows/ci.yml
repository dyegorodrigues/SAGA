name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fechar-f05:
    name: Registrar fechamento F05
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/corrigir-n106' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n106
          fetch-depth: 0
      - name: Atualizar RETOMADA e limpar bancada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AI_Studio_Lab/codex/RETOMADA.md')
          s = p.read_text()
          marker = '## Registro Codex — N1.06 / F05 (7/ago/2026)'
          if marker not in s:
              registro = r'''

---

## Registro Codex — N1.06 / F05 (7/ago/2026)

**Branch:** `codex/corrigir-n106` · **PR:** #27 · **estado:** correção fechada,
**NÃO ativada**. `N1.06` continua fora de `COMPOSER_CANARIES`; a produção segue
no rollback legado até existir PR separado de ativação.

A F05 foi relida §1–§9 e auditada como sistema: ficha/Bíblia → grafo → Composer →
`audiochoice` → Stage/Renderer → GameLoop → Radar/evidência → sonda/Chromium.
Defeitos confirmados antes da ativação: opções antes da primeira audição; erro
travando a tela e podendo revelar a resposta; autoplay não reiniciando com alvo
igual na questão seguinte; beat de ondas inerte; feedback/voz genéricos do
GameLoop por cima do feedback autoral; mascote/balão/cartão/`Como faz?` invadindo
a tela vazia; diagnóstico `audiochoice` sem chegar ao Radar; evidência de
`PRIMEIRA_AUDICAO` possível depois de primeira resposta errada; hipóteses
cumulativas apagadas por `questionDiagnostics`; quatro alternativas em 3+1
criando pista posicional; e uma primeira solução que colocou o enunciado dentro
do Stage e foi corretamente reprovada pela invariável global `enunciadoUnico`.

**Arquitetura final:** Stage desenha a interação e sinaliza o fim da primeira
audição; Renderer apenas transporta o evento; o **GameLoop continua sendo o único
dono de `q.prompt`** e o revela no momento correto. O palco possui retry/feedback
autoral; o GameLoop registra a tentativa e não fala por cima. `audioChoiceRuntime`
concentra diagnóstico/evidência temporal. Quatro opções usam 2×2; duas 1×2; três
1×3. A correção compartilhada de `questionDiagnostics` preserva uma hipótese
embutida numa ação terminal correta — necessário também para F51/F04.

**⚠️ Divergência declarada F05 §4 × §6 — `NAO_ESCUTOU`.** A §4 manda o áudio tocar
automaticamente antes de as opções aparecerem; portanto "primeira opção sem
apertar replay" não prova que a criança não ouviu. A tag ficou restrita ao estado
temporal defensivo em que uma resposta ocorre antes do fim da primeira audição;
a posição estática nunca a emite.

**Portões:** CI completo verde no run `31188064450` (catálogo, fichas, grafo,
TypeScript, testes, build e guarda). Portão visual final verde no run
`31188061774`: **8 sementes**, Chromium real, abertura → convite → erro suave →
retry → fecho e níveis 1/4/5. Os prints L4/L5 confirmaram grade 2×2 simétrica.
A foto dinâmica do fecho da sonda mantém o prompt porque a casca simplificada não
modela `status="right"`; no app real o GameLoop o esconde por `!status`, protegido
por `enunciadoUnico.test.ts`. Não se mudou runtime para satisfazer esse falso
estado da bancada.

**Inventário documental:** `AI_Studio_Lab/pedagogia/PRIMITIVAS_SAGA.md` está
atrasado nesta área — ainda descreve `AudioChoice`/`TouchPlace` como "faltando
ligar", embora Composer e renderer já os alcancem. Tratar esse inventário como
histórico até revisão documental própria.

### Auditoria paralela já confirmada — N1.13 / F04

Nenhum código F04 foi misturado neste PR. Para a próxima branch da fila já foi
confirmado: grafo coerente (`N1.13` nasce de `N1.02 + N1.04`, sem usurpar N1.09);
`TouchPlace` tem toque alternativo mas não o **arrasto** exigido por F04 §4 +
adendo §8.3-bis; Mão Fantasma não demonstra de fato bandeja0→vaga0;
`TouchPlaceStage` não reseta em nova `spec`; existe corrida de ~500ms no
auto-fecho capaz de perder recusa recente; o retry/feedback autoral conflita com
o retry genérico do GameLoop; `DEPENDE_DE_ANDAIME` existe no procedimento/teste
mas não tem consumidor e deve ser ligado como diagnóstico **longitudinal**; a
suspeita de corrupção automática da coroa por recusas não foi confirmada — não
alterar `progressEngine` sem prova reproduzível.

Próximo trabalho: branch própria da `main` para **N1.13/F04**, corrigir o lote,
gerar/abrir prints e só depois pensar em ativação.
'''
              p.write_text(s + registro)
          Path('.github/workflows/visual-n106.yml').unlink(missing_ok=True)
          PY
          git diff --check
      - name: Restaurar a CI original e commitar
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: registra fechamento da correção F05'
          git push origin HEAD:codex/corrigir-n106

  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria do catálogo
        run: npm run auditar
      - name: Auditoria das fichas
        run: npm run fichas:auditar
      - name: Sincronia do grafo
        run: npm run grafo:check
      - name: TypeScript
        run: npm run lint
      - name: Testes
        run: npm test -- --run
      - name: Build
        run: npm run build

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs
