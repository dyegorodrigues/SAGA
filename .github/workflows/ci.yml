          const start = requireNumber(params.start, `start em ${micro.id}`);
          const end = requireNumber(params.end, `end em ${micro.id}`);
          const jump = requireNumber(params.jump_size, `jump_size em ${micro.id}`);
          if (end <= start || jump <= 0 || jump > end - start) {
            throw new Error(`Intervalo inválido para numberline em ${micro.id}.`);
          }
          const current = randomInt(start, end - jump);
          const next = current + jump;
          const options = numericOptions(next, [current, next + jump, current - jump], start, end, {
            preferredCount: 3,
            diagnoses: [
              { tag: MisconceptionTag.OFF_BY_ONE, when: value => value === next + jump },
              { tag: MisconceptionTag.DIRECAO_ERRADA, when: value => value === current - jump },
            ],
          });
          return {
            ...base,
