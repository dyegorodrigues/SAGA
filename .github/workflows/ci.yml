                : "Pense na contagem para frente: qual vizinho vem depois?",
              explain: antecessor
                ? "O antecessor é sempre um a menos."
                : "O sucessor é sempre um a mais.",
            };
          }

          if (params.modo === "ordenacao") {
            const start = requireNumber(params.start, `start em ${micro.id}`);
            const end = requireNumber(params.end, `end em ${micro.id}`);
            if (end - start < 3) throw new Error(`Intervalo curto demais para ordenação em ${micro.id}.`);
            const count = Math.random() < 0.5 ? 3 : 4;
            const first = randomInt(start, end - count + 1);
            const ascending = Array.from({ length: count }, (_, index) => first + index);
            const correct = ascending.join(" → ");
            const reversed = [...ascending].reverse();
            const swapped = [...ascending];
            [swapped[0], swapped[1]] = [swapped[1], swapped[0]];
            const rotated = [...ascending.slice(1), ascending[0]];
            const uniqueSequences = Array.from(new Set([ascending, reversed, swapped, rotated]
              .map(sequence => sequence.join(" → "))));
            const options = shuffleOptions(uniqueSequences.slice(0, 4).map(sequence => ({
              label: sequence,
              value: sequence,
              ...(sequence === correct ? {} : { misconception: MisconceptionTag.ORDEM_ERRADA }),
            })));
            const cards = shuffleOptions(ascending.map(value => ({ label: String(value), value })))
              .map(option => option.value);
            return {
              ...base,
              kind: "plain",
              prompt: params.audio_prompt ?? "Coloque os números do menor para o maior.",
              big: cards.join("   "),
              options,
              answer: correct,
              uiProps: { ...params, text: cards.join("   "), cards },
              evaluate: ans => String(ans) === correct,
              howto: "Comece pelo menor e siga a ordem da contagem.",
              explain: "Ordenar é colocar os números na mesma ordem em que aparecem quando contamos.",
            };
          }

          const fixedAnswer = params.answer;
'''
          if plain_anchor not in composer:
            raise SystemExit('âncora plain não encontrada')
          composer = composer.replace(plain_anchor, plain_insert, 1)
          composer_path.write_text(composer)

          Path('src/curriculum/fichas/jornada/N1.07.ts').write_text('''import { FichaCompetencia } from "../../schema";

/**
 * N1.07 — ordem, sucessor e antecessor até 10.
 * Jornada ensina/observa o conceito completo; JD4 automatiza depois.
 */
export const N1_07: FichaCompetencia = {
  id: "N1.07",
  nome: "Ordem, sucessor e antecessor até 10",
  strand: "N1",
  faixa: "F0",
