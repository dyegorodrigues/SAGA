name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fechar-f05:
    name: Registrar fechamento F05
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/corrigir-n106' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n106
          fetch-depth: 0
      - name: Atualizar RETOMADA e limpar bancada
        run: python3 -c "from pathlib import Path; import base64; p=Path('AI_Studio_Lab/codex/RETOMADA.md'); s=p.read_text(); marker='## Registro Codex — N1.06 / F05 (7/ago/2026)'; reg=base64.b64decode('').decode(); p.write_text(s if marker in s else s+reg); Path('.github/workflows/visual-n106.yml').unlink(missing_ok=True)"
      - name: Restaurar a CI original e commitar
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: registra fechamento da correção F05'
          git push origin HEAD:codex/corrigir-n106

  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria do catálogo
        run: npm run auditar
      - name: Auditoria das fichas
        run: npm run fichas:auditar
      - name: Sincronia do grafo
        run: npm run grafo:check
      - name: TypeScript
        run: npm run lint
      - name: Testes
        run: npm test -- --run
      - name: Build
        run: npm run build

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs
