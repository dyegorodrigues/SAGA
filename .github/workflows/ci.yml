name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-f47:
    name: Integrar F47 atomicamente
    if: github.event.action == 'reopened' && github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Patch sem reescrever GameLoop pelo conector
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/GameLoop.tsx')
          s = p.read_text()
          reps = [
            ('  evidenciasDaResposta,\n  isMotorSlip,', '  authorialFeedbackHoldMs,\n  evidenciasDaResposta,\n  isMotorSlip,'),
            ('import { GameLoopExerciseRenderer } from "./gameloop/GameLoopExerciseRenderer";\n', 'import { GameLoopExerciseRenderer } from "./gameloop/GameLoopExerciseRenderer";\nimport { QuestionPrompt } from "./gameloop/QuestionPrompt";\n'),
            ('{status ? msg : q.prompt}', '{status ? msg : <QuestionPrompt q={q} />}'),
            ('const espera = feedbackAutoral ? 1500 : 10000;', 'const espera = feedbackAutoral ? authorialFeedbackHoldMs(q, answerMeta) : 10000;'),
          ]
          for old, new in reps:
            n = s.count(old)
            if n != 1:
              raise SystemExit(f'GameLoop: esperado 1 ocorrência, achei {n}: {old[:70]}')
            s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/components/primitives/CenaDePosicaoStage.tsx')
          s = p.read_text()
          old = '''      setTocouReferencial(true);\n      falar?.(FALAS.erroDoReferencial(spec.referencial.nome, spec.pedida));\n      onAnswer?.("referencial", acao(null));\n      agendar(() => setTocouReferencial(false), DURACAO_ERRO);'''
          new = '''      setTocouReferencial(true);\n      setFeedbackErro(true);\n      falar?.(FALAS.erroDoReferencial(spec.referencial.nome, spec.pedida));\n      onAnswer?.("referencial", acao(null));\n      agendar(() => {\n        setTocouReferencial(false);\n        setFeedbackErro(false);\n      }, DURACAO_ERRO);'''
          if s.count(old) != 1:
            raise SystemExit('CenaDePosicaoStage: bloco do referencial mudou')
          s = s.replace(old, new)
          old = '''        <motion.div\n          key={`campo-${entradaSeq}`}\n          ref={campo}'''
          new = '''        <motion.div\n          key={`campo-${entradaSeq}`}\n          data-position-field\n          ref={campo}'''
          if s.count(old) != 1:
            raise SystemExit('CenaDePosicaoStage: campo mudou')
          p.write_text(s)
          PY
      - name: Validar antes de publicar
        run: |
          npm run lint
          npx vitest run src/components/primitives/CenaDePosicaoStage.test.tsx src/components/primitives/CenaDePosicaoStage.f47.test.tsx src/components/gameloop/posicaoAuthorialPolicy.test.tsx src/components/gameloop/answerPolicy.test.ts
      - name: Restaurar CI original e publicar um commit
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/components/GameLoop.tsx src/components/primitives/CenaDePosicaoStage.tsx src/components/primitives/CenaDePosicaoStage.f47.test.tsx src/components/gameloop/QuestionPrompt.tsx src/components/gameloop/posicaoAuthorialPolicy.test.tsx src/components/gameloop/answerPolicy.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'GE.01/F47: integra gesto, retry e cinema na casca'
          git push origin HEAD:codex/integrar-bloco-f0
