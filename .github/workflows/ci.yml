name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/corrigir-n113]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria do catálogo
        run: npm run auditar
      - name: Auditoria das fichas
        run: npm run fichas:auditar
      - name: Sincronia do grafo
        run: npm run grafo:check
      - name: TypeScript
        run: npm run lint
      - name: Testes
        run: npm test -- --run
      - name: Build
        run: npm run build

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs

  visual-f04:
    name: Visual F04 — N1.13
    if: github.head_ref == 'codex/corrigir-n113' || github.ref == 'refs/heads/codex/corrigir-n113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/corrigir-n113
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar Chromium
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            sudo mkdir -p /opt/pw-browsers
            sudo chown -R "$USER":"$USER" /opt/pw-browsers
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          test -n "$CHROME_REAL"
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Completar localmente as cenas F04
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sonda/cenas.tsx')
          s = p.read_text()
          old = '  ...[1, 3, 4, 5].map(lvl => ({\n    nome: `N1.13 produzir quantidade (nível ${lvl})`,'
          new = '  ...[1, 2, 3, 4, 5].map(lvl => ({\n    nome: `N1.13 produzir quantidade (nível ${lvl})`,'
          if s.count(old) != 1: raise SystemExit(f'escada F04 esperada 1, achei {s.count(old)}')
          s = s.replace(old, new)
          s = s.replace('nome: "N1.09 micro-aula: as vagas pulsando"', 'nome: "N1.13 micro-aula: as vagas pulsando"')
          anchor = '''  {
    nome: "N1.13 micro-aula: as vagas pulsando",
    render: (s: number) => (
      <ExercicioDaFicha ficha={N1_13} lvl={1} semente={s} mostrar={{ pulsarVagas: true }} />
    ),
  },'''
          ghost = anchor + '''
  {
    nome: "N1.13 micro-aula: mao fantasma bandeja para vaga",
    render: (s: number) => (
      <ExercicioDaFicha ficha={N1_13} lvl={1} semente={s}
        mostrar={{ maoFantasma: { de: "bandeja", para: "vaga0" } }} />
    ),
  },'''
          if s.count(anchor) != 1: raise SystemExit(f'tutorial F04 esperado 1, achei {s.count(anchor)}')
          p.write_text(s.replace(anchor, ghost))
          PY
      - name: Sonda final F04 — 8 sementes
        env:
          SONDA_SEMENTES: '8'
        run: npm run sonda -- "N1.13"
      - name: Prints obrigatórios do briefing
        env:
          PRINTS_OUT: /tmp/f04/prints
          PRINTS_LARGURA: '390'
        run: node scripts/prints.mjs "N1.13"
      - name: Estados motores reais
        run: |
          mkdir -p /tmp/f04/states
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import { chromium } from 'playwright-core';
          const porta = 5199;
          const vite = spawn('npx', ['vite', '--port', String(porta), '--strictPort'], { stdio: ['ignore','pipe','pipe'], detached: true });
          await new Promise((ok,no) => {
            const t=setTimeout(()=>no(new Error('vite nao subiu')),60000);
            vite.stdout.on('data',d=>{ if(String(d).includes('ready in')){clearTimeout(t);ok();} });
          });
          const browser = await chromium.launch({ executablePath:'/opt/pw-browsers/chromium-1194/chrome-linux/chrome', args:['--no-sandbox'] });
          const page = await browser.newPage({ viewport:{width:390,height:640}, deviceScaleFactor:2 });
          await page.goto(`http://localhost:${porta}/sonda/?sementes=1`,{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.sonda?.total>0);
          const nomes=await page.evaluate(()=>window.sonda.nomes());
          const achar=t=>{const i=nomes.findIndex(n=>n.includes(t));if(i<0)throw new Error(`cena ausente: ${t}`);return i;};
          const ir=async t=>{await page.evaluate(i=>window.sonda.ir(i),achar(t));await page.waitForTimeout(450);};

          await ir('N1.13 produzir quantidade (nível 1)');
          const tray=page.locator('[data-touchplace-tray]');
          const slot=page.locator('[aria-label="Vaga vazia"]').first();
          const tb=await tray.boundingBox(), sb=await slot.boundingBox();
          if(!tb||!sb)throw new Error('bandeja/vaga sem geometria');
          const start={x:tb.x+tb.width/2,y:tb.y+tb.height/2}, end={x:sb.x+sb.width/2,y:sb.y+sb.height/2};
          const vagasAntes=await page.locator('[aria-label="Vaga vazia"]').count();
          await page.mouse.move(start.x,start.y); await page.mouse.down(); await page.mouse.move(end.x,end.y,{steps:8}); await page.waitForTimeout(120);
          await page.screenshot({path:'/tmp/f04/states/90_DRAG_HALO.png'});
          const halos=await page.locator('[aria-label="Vaga vazia"]').evaluateAll(ns=>ns.filter(n=>getComputedStyle(n).boxShadow!=='none').length);
          if(halos<1)throw new Error('drag sem halo');
          await page.mouse.up(); await page.waitForTimeout(250);
          await page.screenshot({path:'/tmp/f04/states/91_DROP.png'});
          const vagasDepois=await page.locator('[aria-label="Vaga vazia"]').count();
          if(vagasDepois!==vagasAntes-1)throw new Error(`drop nao ocupou uma vaga: ${vagasAntes} -> ${vagasDepois}`);

          await ir('N1.13 produzir quantidade (nível 4)');
          if(await page.locator('[aria-label="Vaga vazia"]').count())throw new Error('L4 ainda tem vaga');
          await page.locator('[data-touchplace-tray]').click();
          await page.locator('[role="button"][aria-label^="Colocar "]').first().click({position:{x:80,y:80}});
          const pronto=page.getByRole('button',{name:'Pronto!'});
          await pronto.click(); await page.waitForTimeout(120);
          await page.screenshot({path:'/tmp/f04/states/92_ERRO_PRONTO.png'});
          if(!(await pronto.isDisabled()))throw new Error('feedback de erro nao travou');
          await page.waitForTimeout(950);
          await page.screenshot({path:'/tmp/f04/states/93_RETRY.png'});
          if(await pronto.isDisabled())throw new Error('retry nao voltou');

          await ir('N1.13 produzir quantidade (nível 5)');
          if(await page.locator('[aria-label="Ouvir o pedido de novo"]').count())throw new Error('L5 tem replay');
          await page.screenshot({path:'/tmp/f04/states/94_L5_SEM_REPLAY.png'});

          await page.evaluate(i=>window.sonda.ir(i),achar('mao fantasma bandeja para vaga')); await page.waitForTimeout(900);
          await page.screenshot({path:'/tmp/f04/states/95_MAO_FANTASMA.png'});
          if(!(await page.getByText('👆',{exact:true}).count()))throw new Error('mao fantasma ausente');
          if(!(await page.locator('[aria-label="Vaga vazia"]').count()))throw new Error('tutorial resolveu resposta');
          await browser.close();
          try{process.kill(-vite.pid,'SIGKILL')}catch{vite.kill('SIGKILL')}
          NODE
      - name: Folha de contato
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          files=sorted(Path('/tmp/f04/prints').glob('*.png'))+sorted(Path('/tmp/f04/states').glob('*.png'))
          tw,th,label,cols=195,320,28,2
          rows=(len(files)+cols-1)//cols
          out=Image.new('RGB',(cols*tw,rows*(th+label)),'white'); draw=ImageDraw.Draw(out)
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB'); im.thumbnail((tw,th)); x=(i%cols)*tw; y=(i//cols)*(th+label)
              out.paste(im,(x+(tw-im.width)//2,y+(th-im.height)//2)); draw.text((x+3,y+th+2),p.stem[:40],fill='black')
          out.save('/tmp/f04/contact-sheet.jpg',quality=84)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f04-n113-prints
          path: /tmp/f04
          retention-days: 7
