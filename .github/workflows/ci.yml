name: CI

# Faixa rápida do PR. As sondas transversais longas vivem em
# certificacao-transversal.yml e nunca são canceladas por pushes posteriores.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do HEAD do PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout do push
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Buscar a base do PR
        run: git fetch origin main --depth=1

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria do catálogo
        run: npm run auditar

      - name: Auditoria das fichas
        run: npm run fichas:auditar

      - name: Conformidade das fichas
        run: npm run fichas:conferir

      - name: Sincronia do grafo
        run: npm run grafo:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Guarda textual do PR
        env:
          PR_BASE: origin/main
        run: npm run pr:check

  sonda-sensei-dojo:
    name: Sonda real Sensei
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Resolver Chrome do runner
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium não encontrado no runner." >&2
            exit 1
          fi
          echo "SONDA_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Sonda real das rotas prescritas do Sensei
        run: npm run sonda:sensei-dojo

      - name: Evidências da sonda Sensei
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-sensei-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-sensei-dojo/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F19 — reta numérica
        run: npm run sonda:reta20

      - name: Evidências da sonda F19
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f19-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-reta20/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F61 — régua
        run: npm run sonda:regua

      - name: Evidências da sonda F61
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f61-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-regua/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F29 — comparação simbólica registrada e inativa
        run: npm run sonda:comparacao-simbolica

      - name: Evidências da sonda F29
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f29-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-comparacao/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F36 — Quadrado100 registrado e inativo
        run: npm run sonda:quadrado100

      - name: Evidências da sonda F36
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f36-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-quadrado100/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F13 — VisualAddition registrado e inativo
        run: npm run sonda:visual-addition

      - name: Evidências da sonda F13
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f13-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-visual-addition/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F15 — EmojiRow#riscar registrado e inativo
        run: npm run sonda:emojirow-riscar

      - name: Evidências da sonda F15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f15-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-emojirow-riscar/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F14 — counting on registrado e inativo
        run: npm run sonda:counting-on

      - name: Evidências da sonda F14
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f14-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-counting-on/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F30 — contagem por saltos registrada e inativa
        run: npm run sonda:skip-count

      - name: Evidências da sonda F30
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonda-f30-${{ github.event.pull_request.head.sha }}
          path: .artifacts/sonda-skip-count/
          if-no-files-found: warn
          retention-days: 14

      - name: Sonda real F97 — grupos iguais registrada e inativa
        run: npm run sonda:equal-groups

  higiene-diff:
    name: Higiene do diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Verificar whitespace do diff
        run: >-
          git diff --check origin/${{ github.base_ref }}...HEAD -- .
          ':(exclude)**/*.md' ':(exclude)*.md'

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs
