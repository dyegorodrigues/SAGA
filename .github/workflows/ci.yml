name: CI

# Roda os mesmos gates que o protocolo do projeto já exige antes de publicar.
# A intenção é que "checks verdes" deixe de depender de alguém lembrar de rodar
# tudo localmente e passe a ser condição verificável no PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Temporário P22.3B: o publicador restaura o CI estável no mesmo lote.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates do SAGA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria do catálogo
        run: npm run auditar

      - name: Auditoria das fichas
        run: npm run fichas:auditar

      - name: Sincronia do grafo
        run: npm run grafo:check

      - name: Aplicar patch focal P22.3B no head real
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
        run: |
          git fetch origin codex/integrar-bloco-f0
          git checkout -B codex/integrar-bloco-f0 origin/codex/integrar-bloco-f0
          node AI_Studio_Lab/codex/p22_3b_apply.cjs apply
          node AI_Studio_Lab/codex/p22_3b_fix.cjs

      - name: TypeScript
        run: npm run lint

      - name: Testes
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Sonda real JD4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
        env:
          SONDA_CHROME: /usr/bin/google-chrome
        run: npm run sonda -- "JD4"

      - name: Publicar P22.3B e auto-remover bancada
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
        run: node AI_Studio_Lab/codex/p22_3b_apply.cjs publish

  guarda-textual:
    name: Guarda de binários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Buscar a base do PR
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Verificar ausência de binários no diff
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node AI_Studio_Lab/tools/pr_text_guard.cjs
