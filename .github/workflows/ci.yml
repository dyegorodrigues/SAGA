            const antecessor = params.modo === "antecessor";
            const current = antecessor ? randomInt(start + 1, end) : randomInt(start, end - 1);
            const answer = antecessor ? current - 1 : current + 1;
            const options = numericOptions(
              answer,
              antecessor ? [current, current + 1, current - 2] : [current, current + 2, current - 1],
              start,
              end,
              {
                preferredCount: 3,
