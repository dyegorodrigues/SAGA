name: P21.1 - governance gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Portoes P21.1
        run: |
          npm run auditar
          npm run fichas:auditar
          npm run fichas:conferir
          npm run grafo:check
          npx tsc --noEmit
          npm test -- --run
          npm run build
          npm run pr:check
          git diff --check e2ee44d1d79d910ebbfcb3411d5f65c836616a47..HEAD
      - name: Limpar bancada temporaria
        if: always()
        run: |
          rm .github/workflows/p21-1-governance-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove bancada temporaria P21.1'
          git push origin HEAD:codex/integrar-bloco-f0
