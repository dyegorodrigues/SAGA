name: Prepare F0 canary contract

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  prepare:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Registrar candidatos sem ativar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/curriculum/motores/canaryContract.test.ts')
          s = p.read_text(encoding='utf-8')

          imports = [
            ('import { N1_06 } from "../fichas/jornada/N1.06";', 'import { N1_13 } from "../fichas/jornada/N1.13";'),
            ('import { N1_13 } from "../fichas/jornada/N1.13";', 'import { GE_01 } from "../fichas/jornada/GE.01";'),
            ('import { GE_01 } from "../fichas/jornada/GE.01";', 'import { GE_02 } from "../fichas/jornada/GE.02";'),
            ('import { GE_02 } from "../fichas/jornada/GE.02";', 'import { GM_01 } from "../fichas/jornada/GM.01";'),
            ('import { GM_01 } from "../fichas/jornada/GM.01";', 'import { GM_12 } from "../fichas/jornada/GM.12";'),
          ]
          for anchor, line in imports:
            if line not in s:
              if anchor not in s: raise SystemExit(f'âncora de import ausente: {anchor}')
              s = s.replace(anchor, anchor + '\n' + line, 1)

          anchor = '  "N1.06": N1_06,\n  "AL.02": AL_02,'
          block = '''  "N1.06": N1_06,

  // Próximos candidatos F0: registrados para que o contrato de promoção já
  // saiba provar estreia/substituição, rollback, saves e Radar. Registrar NÃO
  // ativa: o conjunto COMPOSER_CANARIES continua sendo a única chave de produção.
  "N1.13": N1_13,
  "GE.01": GE_01,
  "GE.02": GE_02,
  "GM.01": GM_01,
  "GM.12": GM_12,
  "AL.02": AL_02,'''
          if '  "GM.12": GM_12,' not in s:
            if anchor not in s: raise SystemExit('âncora REGISTRO N1.06/AL.02 ausente')
            s = s.replace(anchor, block, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sonda/cenas.tsx')
          s = p.read_text(encoding='utf-8')
          old = '// L5 — enfim em três dimensões.'
          new = '// L5 — transferência 2D sob variação de representação; sólidos ficam em GE.04.'
          if old in s:
            s = s.replace(old, new, 1)
          elif 'enfim em três dimensões' in s:
            s = s.replace('enfim em três dimensões', 'transferência 2D sob variação de representação; sólidos ficam em GE.04', 1)
          else:
            raise SystemExit('comentário histórico 3D da GE.02 não encontrado')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Provar registro sem promoção
        run: |
          npx tsc --noEmit
          npx vitest run src/curriculum/motores/canaryContract.test.ts src/curriculum/motores/implementacaoSemAtivacao.test.ts
          npm run build

      - name: Publicar preparação e apagar bancada
        run: |
          rm .github/workflows/prepare-f0-canary-contract.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/curriculum/motores/canaryContract.test.ts sonda/cenas.tsx .github/workflows/prepare-f0-canary-contract.yml
          git diff --cached --check
          git commit -m 'canários F0: registra próximos candidatos sem ativá-los'
          git push origin HEAD:codex/integrar-bloco-f0
