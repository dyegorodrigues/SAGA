name: P8 - higiene da UI do Jardim

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar higiene
        run: python AI_Studio_Lab/tools/p8_cleanup_apply.py
      - name: Verificar contrato
        run: |
          git diff --check
          npx tsc --noEmit
          npx vitest run src/components/home/DojoTab.test.tsx src/curriculum/motores/jardimEngine.test.ts src/curriculum/motores/jardimSession.test.ts
      - name: Suite e build
        run: |
          npm test -- --run
          npm run build
      - name: Publicar higiene e limpar bancada
        run: |
          rm AI_Studio_Lab/tools/p8_cleanup_apply.py .github/workflows/p8-jardim-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P8: remove caminho morto do Garden antigo'
          git push origin HEAD:codex/integrar-bloco-f0
