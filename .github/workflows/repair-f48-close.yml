name: Repair F48 close

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  repair:
    if: github.head_ref == 'codex/integrar-bloco-f0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrar-bloco-f0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corrigir a segunda rotação do fecho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/primitives/FormaStage.tsx')
          s=p.read_text(encoding='utf-8')
          old='''            const rodando = (fase === "acerto" && certa) || Boolean(emAula && certa && mostrar?.girarAlvo);\n            const mostraLados = sucesso || Boolean(emAula && certa && mostrar?.contarLadosAlvo);'''
          new='''            // A lição gira 360° no acerto. No fecho, 360° deve permanecer\n            // como estado final (visualmente igual a 0°), sem uma segunda volta\n            // inversa 360→0 que faria a legenda nascer girando/cortada.\n            const rodando = (fase === "acerto" && certa) || Boolean(emAula && certa && mostrar?.girarAlvo);\n            const manterRotacaoFinal = sucesso || Boolean(emAula && certa && mostrar?.girarAlvo);\n            const mostraLados = sucesso || Boolean(emAula && certa && mostrar?.contarLadosAlvo);'''
          if s.count(old)!=1: raise SystemExit('bloco rodando mudou')
          s=s.replace(old,new,1)
          old2='''                  rotate: rodando ? 360 : 0,'''
          new2='''                  rotate: manterRotacaoFinal ? 360 : 0,'''
          if s.count(old2)!=1: raise SystemExit('animate rotate mudou')
          s=s.replace(old2,new2,1)
          old3='''                  <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-lg bg-white px-2 py-1 text-[12px] font-black text-blue-800 shadow">'''
          new3='''                  <span data-forma-close-label className="absolute -bottom-8 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-lg bg-white px-2 py-1 text-[12px] font-black text-blue-800 shadow">'''
          if s.count(old3)!=1: raise SystemExit('label fecho mudou')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          npx tsc --noEmit
          npx vitest run src/components/primitives/FormaStage.f48.test.tsx src/components/gameloop/formaAuthorialPolicy.test.ts src/components/gameloop/posicaoAuthorialPolicy.test.tsx
      - name: Provar fecho em Chromium
        run: |
          sudo mkdir -p /opt/pw-browsers/chromium-1194/chrome-linux
          CHROME_REAL="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_REAL" ]; then
            PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
            CHROME_REAL="$(find /opt/pw-browsers -type f -name chrome | head -n 1)"
          fi
          sudo ln -sf "$CHROME_REAL" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
          mkdir -p /tmp/f48-close
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import {chromium} from 'playwright-core';
          const port=5199;
          const vite=spawn('npx',['vite','--port',String(port),'--strictPort'],{stdio:['ignore','pipe','pipe'],detached:true});
          await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('vite nao subiu')),60000);vite.stdout.on('data',d=>{if(String(d).includes('ready in')){clearTimeout(t);ok();}})});
          const browser=await chromium.launch({executablePath:'/opt/pw-browsers/chromium-1194/chrome-linux/chrome',args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:720},deviceScaleFactor:2});
          await page.goto(`http://localhost:${port}/sonda/?sementes=1`,{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.sonda?.total>0);
          const nomes=await page.evaluate(()=>window.sonda.nomes());
          const i=nomes.findIndex(n=>n.includes('GE.02 que forma é essa (nível 2)'));
          if(i<0) throw new Error('cena F48 L2 ausente');
          await page.evaluate(i=>window.sonda.ir(i),i);
          await page.waitForTimeout(950);
          const alvo=(await page.locator('body').innerText()).match(/Qual é o (círculo|quadrado|triângulo|retângulo)/i)?.[1];
          if(!alvo) throw new Error('alvo não encontrado');
          const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
          const labs=await page.locator('button[data-forma-figura]').evaluateAll(bs=>bs.map(b=>(b.getAttribute('aria-label')||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()));
          const idx=labs.findIndex(x=>x.includes(norm(alvo)));
          await page.locator('button[data-forma-figura]').nth(idx).click();
          await page.waitForTimeout(2700);
          const label=page.locator('[data-forma-close-label]');
          if(await label.count()!==1) throw new Error('label de fecho ausente');
          const box=await label.boundingBox();
          if(!box || box.x<0 || box.y<0 || box.x+box.width>390 || box.y+box.height>720) throw new Error(`label de fecho cortada: ${JSON.stringify(box)}`);
          const transform=await page.locator('button[data-forma-close=true]').evaluate(el=>getComputedStyle(el).transform);
          if(transform && transform!=='none') {
            const m=transform.match(/matrix\(([^)]+)\)/);
            if(m){const [a,b]=m[1].split(',').map(Number); if(Math.abs(b)>0.05 || Math.abs(a-1)>0.05) throw new Error(`fecho ainda inclinado: ${transform}`);}
          }
          await page.screenshot({path:'/tmp/f48-close/fecho-estavel.png'});
          await browser.close();
          try{process.kill(-vite.pid,'SIGKILL')}catch{vite.kill('SIGKILL')}
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: f48-close-proof
          path: /tmp/f48-close
          retention-days: 7
      - name: Publicar reparo e apagar executor
        run: |
          rm .github/workflows/repair-f48-close.yml
          git config user.name 'SAGA Codex'
          git config user.email 'noreply@github.com'
          git add src/components/primitives/FormaStage.tsx .github/workflows/repair-f48-close.yml
          git diff --cached --check
          git commit -m 'GE.02/F48: estabiliza o fecho após o giro'
          git push origin HEAD:codex/integrar-bloco-f0
