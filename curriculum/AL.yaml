strand: "AL"
name: "Álgebra e Padrões"
color: "amarelo"
nodes:
  AL.01:
    title: "Classificação e o intruso"
    objective: "agrupar por atributo (cor, forma, tamanho, categoria) e achar o que não pertence."
    prereqs:
    kinds:
      - "plain (intruso — existente)"
      - "groups"
      - "drag-group."
    micros:
      - "a) intruso por diferença gritante (3 frutas + 1 carro) · b) por cor/tamanho · c) por categoria sutil (voa/não voa) · d) separar em 2 caixas por atributo (arrastar)"
  AL.02:
    title: "Padrões de repetição"
    objective: "perceber, continuar e criar padrões (a raiz da álgebra)."
    prereqs:
      - "AL.01"
    kinds:
      - "pattern (existente)."
    micros:
      - "a) continuar ABAB (cores) · b) ABAB (formas/sons) · c) ABC · d) AABB · e) achar o ERRO no padrão (mais difícil que continuar)"
  AL.03:
    title: "Contagem por saltos (2, 5, 10)"
    objective: "contar de 2 em 2, 5 em 5, 10 em 10 — a ponte rítmica para a multiplicação."
    prereqs:
      - "N1.09"
      - "N2.01"
    kinds:
      - "order"
      - "numberline"
      - "plain (pular — existente)."
    micros:
  AL.04:
    title: "Sequências e regra de formação"
    objective: "descobrir e aplicar a regra de sequências numéricas (+2, +5, −3, ×2)."
    prereqs:
      - "AL.03"
      - "N3.09"
    kinds:
      - "order"
      - "pattern"
      - "plain."
    micros:
  AL.05:
    title: "Igualdade como equilíbrio"
    objective: "o \"=\" significa \"os dois lados valem o mesmo\" — não \"a resposta vem aí\"."
    prereqs:
      - "N2.03"
      - "N3.05"
    kinds:
      - "balance (PRIORIDADE 2: balança que inclina)"
      - "math."
    micros:
  AL.06:
    title: "Expressões, propriedades e a incógnita"
    objective: ""
    prereqs:
      - "AL.05"
      - "N4.06"
    kinds:
      - "balance"
      - "math"
      - "plain."
    micros:
  AL.07:
    title: "Linguagem algébrica e generalização"
    objective: ""
    prereqs:
      - "AL.06"
      - "AL.04"
    kinds:
      - "pattern (com termo geral)"
      - "math"
      - "plain."
